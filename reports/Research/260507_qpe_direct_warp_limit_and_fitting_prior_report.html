<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QPE Direct Warp Limit and Fitting-Prior Transition</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #090d16;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .background-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(15, 23, 42, 0.03) 50%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }
    .card {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 450px;
      padding: 38px 32px;
      background: rgba(17, 24, 39, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.35s ease-in-out;
    }
    .lock-icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #818cf8;
    }
    .lock-icon svg {
      width: 28px;
      height: 28px;
      stroke-width: 2;
    }
    .vault-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #818cf8;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f3f4f6;
      margin-bottom: 8px;
      line-height: 1.4;
      word-break: keep-all;
    }
    p.desc {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .input-group {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 13px 44px 13px 16px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.95);
    }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s;
    }
    .toggle-pw:hover {
      color: #94a3b8;
    }
    .btn-unlock {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    }
    .btn-unlock:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
    }
    .btn-unlock:active {
      transform: translateY(0);
    }
    .btn-unlock:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-msg {
      margin-top: 14px;
      font-size: 0.82rem;
      color: #f87171;
      min-height: 18px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .error-msg.visible {
      opacity: 1;
    }
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="background-glow"></div>
  <div class="card" id="lockCard">
    <div class="lock-icon">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <div class="vault-tag">🔬 Research Vault (연구 기밀 문서)</div>
    <h1>QPE Direct Warp Limit and Fitting-Prior Transition</h1>
    <p class="desc">보호된 문서입니다.<br>열람하려면 비밀번호를 입력하세요.</p>
    
    <div class="input-group">
      <input type="password" id="pwInput" placeholder="비밀번호 입력" autocomplete="current-password" autofocus>
      <button type="button" class="toggle-pw" id="togglePw" title="비밀번호 보기">
        <svg id="eyeIcon" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        </svg>
      </button>
    </div>

    <button class="btn-unlock" id="unlockBtn">
      <span class="spinner" id="btnSpinner"></span>
      <span id="btnText">열람하기</span>
    </button>
    <div class="error-msg" id="errorMsg">비밀번호가 올바르지 않습니다.</div>
  </div>

    const STORAGE_KEY = "__pensieve_research_vault_pass__";

    const pwInput = document.getElementById('pwInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const lockCard = document.getElementById('lockCard');
    const errorMsg = document.getElementById('errorMsg');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const togglePw = document.getElementById('togglePw');

    togglePw.addEventListener('click', () => {
      const isPw = pwInput.type === 'password';
      pwInput.type = isPw ? 'text' : 'password';
    });

    pwInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') unlock();
    });
    unlockBtn.addEventListener('click', unlock);

    async function decryptPayload(base64Payload, password) {
      const binaryString = atob(base64Payload);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      
      const salt = bytes.slice(0, 16);
      const iv = bytes.slice(16, 28);
      const data = bytes.slice(28);
      
      const pwBytes = new TextEncoder().encode(password);
      const keyMaterial = await crypto.subtle.importKey(
        'raw', pwBytes, { name: 'PBKDF2' }, false, ['deriveKey']
      );
      
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      
      const decryptedBuf = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        aesKey,
        data
      );
      
      return new TextDecoder().decode(decryptedBuf);
    }

    function renderDecrypted(html) {
      document.open();
      document.write(html);
      document.close();
    }

    async function unlock() {
      const pass = pwInput.value;
      if (!pass) {
        pwInput.focus();
        return;
      }

      setLoading(true);
      errorMsg.classList.remove('visible');
      lockCard.classList.remove('shake');

      try {
        const decryptedHtml = await decryptPayload(CIPHERTEXT, pass);
        try {
          sessionStorage.setItem(STORAGE_KEY, pass);
        } catch (e) {}
        renderDecrypted(decryptedHtml);
      } catch (err) {
        setLoading(false);
        lockCard.classList.add('shake');
        errorMsg.classList.add('visible');
        pwInput.value = '';
        pwInput.focus();
      }
    }

    function setLoading(isLoading) {
      unlockBtn.disabled = isLoading;
      pwInput.disabled = isLoading;
      btnSpinner.style.display = isLoading ? 'inline-block' : 'none';
      btnText.textContent = isLoading ? '복호화 중...' : '열람하기';
    }

    // Auto-unlock with session cache
    window.addEventListener('DOMContentLoaded', async () => {
      let cached = null;
      try {
        cached = sessionStorage.getItem(STORAGE_KEY);
      } catch (e) {}
      
      if (cached) {
        setLoading(true);
        try {
          const decryptedHtml = await decryptPayload(CIPHERTEXT, cached);
          renderDecrypted(decryptedHtml);
        } catch (e) {
          try { sessionStorage.removeItem(STORAGE_KEY); } catch(err) {}
          setLoading(false);
        }
      }
    });
  </script>
