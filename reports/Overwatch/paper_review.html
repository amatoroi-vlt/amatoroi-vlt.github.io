<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>논문 아카이브</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js for High-Performance Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <style>
    :root {
      --bg-ground: #0a0e17;
      --bg-panel: #111827;
      --bg-card: #172033;
      --bg-card-hover: #1e293b;
      --bg-card-active: #1e2d4a;
      --border-subtle: #2d3748;
      --border-focus: #3b82f6;
      --ink-base: #e2e8f0;
      --ink-muted: #94a3b8;
      --ink-heading: #f8fafc;
      --accent-primary: #38bdf8;
      --accent-subtle: rgba(56, 189, 248, 0.12);
      --accent-gold: #fbbf24;
      --accent-green: #34d399;
      --accent-purple: #c084fc;
      --tag-bg: #1e293b;
      --tag-border: #334155;
      --tag-text: #94a3b8;
      --tag-active-bg: rgba(56, 189, 248, 0.2);
      --tag-active-border: #38bdf8;
      --tag-active-text: #38bdf8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      --font-serif: 'Noto Serif KR', Georgia, serif;
      --font-mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
      --header-height: 54px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      background: var(--bg-ground);
      color: var(--ink-base);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation / Header */
    header {
      height: var(--header-height);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .brand-badge {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.22rem 0.55rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink-heading);
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .search-box-wrapper {
      flex: 1;
      max-width: 460px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.6rem 1rem 0.6rem 2.25rem;
      color: var(--ink-heading);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      background: #172642;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      width: 15px;
      height: 15px;
      pointer-events: none;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-family: var(--font-mono);
    }

    .stat-pill b {
      color: var(--accent-primary);
    }

    /* Main Container (Master - Detail Layout) */
    .app-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left Pane: Master List */
    .master-pane {
      width: 380px;
      min-width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: margin-left 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .app-container.master-collapsed .master-pane {
      display: none !important;
    }

    .filter-bar {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(8px);
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 130px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .chip {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      transition: all 0.15s ease;
      user-select: none;
    }

    .chip:hover {
      border-color: var(--ink-muted);
      color: var(--ink-base);
    }

    .chip.active {
      background: var(--tag-active-bg);
      border-color: var(--tag-active-border);
      color: var(--tag-active-text);
      font-weight: 600;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scrollbar-width: thin;
    }

    .paper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }

    .paper-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .paper-card.active {
      background: var(--bg-card-active);
      border-color: var(--accent-primary);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }

    .paper-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      background: var(--accent-primary);
      border-radius: 0 4px 4px 0;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-year-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-primary);
      background: var(--accent-subtle);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .card-journal {
      font-size: 0.75rem;
      color: var(--accent-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-style: italic;
    }

    .card-title-ko {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-heading);
      line-height: 1.4;
    }

    .card-title-en {
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .card-tag {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--ink-muted);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    /* Right Pane: Detail View */
    .detail-pane {
      flex: 1;
      background: var(--bg-ground);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .detail-header {
      padding: 0.95rem 1.25rem;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
    }

    .detail-top-badges {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .badge-year {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.15rem 0.48rem;
      border-radius: 5px;
    }

    .badge-journal {
      color: var(--accent-gold);
      font-size: 0.78rem;
      font-style: italic;
      font-weight: 500;
      line-height: 1.35;
    }

    .detail-title-ko {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--ink-heading);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .detail-title-en {
      font-size: 0.84rem;
      color: var(--ink-muted);
      line-height: 1.35;
      font-weight: 400;
    }

    .detail-authors {
      font-size: 0.78rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      line-height: 1.35;
    }

    .authors-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.08rem 0.38rem;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .detail-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .local-source-links {
      display: none;
      align-items: center;
      gap: 0.45rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--ink-base);
      transition: all 0.15s ease;
      font-family: var(--font-sans);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    .action-btn.source-btn {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.32);
      color: var(--accent-primary);
    }

    .action-btn.source-btn:hover {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent-primary);
      color: #7dd3fc;
    }

    /* Detail Content Scroll Area */
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1.75rem 3.5rem;
      line-height: 1.7;
      scrollbar-width: thin;
    }

    .summary-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    /* Markdown Rendered Typography */
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-family: var(--font-serif);
      color: var(--ink-heading);
      margin-top: 1.5rem;
      margin-bottom: 0.65rem;
      line-height: 1.35;
    }

    .markdown-body h1 { font-size: 1.3rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.5rem; }
    .markdown-body h2 { font-size: 1.15rem; color: var(--accent-primary); border-left: 3px solid var(--accent-primary); padding-left: 0.65rem; margin-top: 1.75rem; }
    .markdown-body h3 { font-size: 1.02rem; color: #f1f5f9; border-left: 3px solid var(--accent-primary); padding-left: 0.6rem; margin-top: 1.5rem; }

    .markdown-body p {
      margin-bottom: 0.95rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.05rem;
      padding-left: 1.4rem;
      color: #cbd5e1;
      font-size: 0.9rem;
    }

    .markdown-body li {
      margin-bottom: 0.45rem;
    }

    .markdown-body strong {
      color: #f8fafc;
      font-weight: 700;
    }

    .markdown-body blockquote {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid var(--accent-primary);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.25rem 0;
      font-style: normal;
      color: #e2e8f0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.88rem;
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .markdown-body th {
      background: #1e293b;
      color: var(--ink-heading);
      padding: 0.85rem 1rem;
      text-align: left;
      font-weight: 700;
      border-bottom: 2px solid var(--border-subtle);
    }

    .markdown-body td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      margin: 1.5rem 0;
      display: block;
      background: #0f172a;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      background: #1e293b;
      color: var(--accent-gold);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .markdown-body pre {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1.25rem 0;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      color: var(--ink-base);
    }

    .markdown-body a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .markdown-body a:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-primary);
      color: #7dd3fc;
      transform: translateY(-1px);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-muted);
      text-align: center;
      gap: 1rem;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .master-pane {
        width: 100%;
        height: 38vh;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }
      .detail-pane {
        flex: 1;
        min-height: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <button class="action-btn" id="toggleMasterBtn" title="논문 목록 접기/펼치기" style="padding: 0.3rem 0.6rem;">
        <span id="toggleMasterIcon">◀</span> <span id="toggleMasterText">논문 목록</span>
      </button>
      <span class="brand-badge">RESEARCH ARCHIVE</span>
      <h1 class="brand-title">논문 아카이브</h1>
    </div>

    <div class="search-box-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="논문 제목, 저자, 키워드, 내용 검색 (Ctrl + K)...">
    </div>

    <div class="stats-bar">
      <div class="stat-pill">총 보관 <b id="totalCountBadge">8편</b></div>
    </div>
  </header>

  <!-- App Body -->
  <div class="app-container">
    
    <!-- Left Master List Pane -->
    <aside class="master-pane">
      <div class="filter-bar">
        <div class="filter-label">연도별 필터</div>
        <div class="chips-wrapper" id="yearFilterChips">
          <div class="chip active" data-filter-type="year" data-value="ALL">전체 (8)</div>
          <div class="chip" data-filter-type="year" data-value="2026">2026</div><div class="chip" data-filter-type="year" data-value="2025">2025</div><div class="chip" data-filter-type="year" data-value="2024">2024</div><div class="chip" data-filter-type="year" data-value="2022">2022</div>
        </div>

        <div class="filter-label" style="margin-top: 0.2rem;">주제별 태그</div>
        <div class="chips-wrapper" id="tagFilterChips">
          <div class="chip active" data-filter-type="tag" data-value="ALL">전체 태그</div>
          <div class="chip" data-filter-type="tag" data-value="Geant4/시뮬레이션">#Geant4/시뮬레이션</div><div class="chip" data-filter-type="tag" data-value="NORM">#NORM</div><div class="chip" data-filter-type="tag" data-value="Pb-210/Bi-210">#Pb-210/Bi-210</div><div class="chip" data-filter-type="tag" data-value="Ra-226">#Ra-226</div><div class="chip" data-filter-type="tag" data-value="감마분광">#감마분광</div><div class="chip" data-filter-type="tag" data-value="건축자재">#건축자재</div><div class="chip" data-filter-type="tag" data-value="방사평형">#방사평형</div><div class="chip" data-filter-type="tag" data-value="숙련도시험">#숙련도시험</div><div class="chip" data-filter-type="tag" data-value="이온성액체">#이온성액체</div><div class="chip" data-filter-type="tag" data-value="체렌코프">#체렌코프</div><div class="chip" data-filter-type="tag" data-value="효율교정">#효율교정</div>
        </div>
      </div>

      <div class="card-list" id="cardListContainer">
        <!-- Rendered dynamically by JS -->
      </div>
    </aside>

    <!-- Right Detail Pane -->
    <main class="detail-pane" id="detailPane">

      <!-- Detail Content Body (Header + Summary scroll together) -->
      <div class="detail-body" id="detailBody">
        <div class="summary-wrapper">
          <!-- Detail Header (scrolls naturally with content) -->
          <div class="detail-header" id="detailHeader">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem;">
              <div style="display: flex; flex-direction: column; gap: 0.35rem; flex: 1; min-width: 0;">
                <div class="detail-top-badges">
                  <span class="badge-year" id="dhYear">2026</span>
                  <span class="badge-journal" id="dhJournal">Journal Name</span>
                </div>
                <h2 class="detail-title-ko" id="dhTitleKo">논문 제목 (한글)</h2>

    const PAPERS = [{"id": "2026_remage_a_Geant4_based_simulation_framework_for_low_background_experiments", "year": "2026", "en_title": "remage: a Geant4-based simulation framework for low-background experiments", "ko_title": "저백그라운드 물리 실험을 위한 Geant4 기반 범용 시뮬레이션 프레임워크 (remage)", "journal": "arXiv:2610.29655v1 [physics.ins-det] (Prepared for submission to JINST, 2026)", "authors": "Toby Dixon, Eric Esch, Reyco Henning, Manuel Huber, Moritz Neuberger, Luigi Pertoldi, Zichen Wang", "takeaway": "저백그라운드 실험의 몬테카를로 시뮬레이션을 표준화하기 위해 검출기 기하구조 정의(Python 기반 확장 GDML)와 입자 추적 엔진(C++ 코어)을 완전 분리한 오픈소스 프레임워크 `remage`를 개발함. 벌크·표면·깊이 프로파일 정점 샘플러와 저에너지 물리 리스트, 후처리 도구(`reboost`)를 통합하고, 스텝 클러스터링 및 조건부 추적(최대 170배 가속)을 구현하여 HADES 지하실험실 BEGe 검출기의 Th-228 실험 스펙트럼을 300 keV 이상 전 대역에서 3σ 이내로 정밀 재현함.", "tags": ["감마분광", "Geant4/시뮬레이션"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 중성미자 없는 이중 베타 붕괴(0νββ) 및 암흑물질 탐색 등 저백그라운드 물리학 실험에서는 방사성(Radiogenic) 및 우주선 기원(Cosmogenic) 배경 방사선을 정밀 모델링하고 검출기 설계를 최적화하기 위해 Geant4 기반 몬테카를로 시뮬레이션이 필수적으로 사용됩니다.\n- **핵심 문제 (Problem & Gap)**: 기존에는 각 실험 그룹마다 방대한 C++ 코드로 복잡한 검출기 기하구조(Geometry), 물리 리스트(Physics List), 사건 생성기 및 입출력 루틴을 자체 개발·유지보수해야 했으며, 실험 고유의 기하구조 보안 문제로 인해 코드 공유가 제한되고 Geant4 버전 업그레이드 시 물리 결과의 일관성을 검증하는 데 막대한 인력이 소모되었습니다.\n- **연구 목표**: 실험 기하구조 정의(Python/GDML)와 입자 추적 코어 엔진(C++)을 완전히 분리하여 재컴파일 없이 매크로 설정만으로 구동 가능한 범용 오픈소스 저백그라운드 시뮬레이션 프레임워크(`remage`)를 설계하고, 자동화된 물리 검증 스위트 및 HADES 지하실험실 HPGe 측정 데이터와의 종단간(End-to-End) 비교를 통해 정확도와 연산 확장성을 입증합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **기하구조와 추적 엔진의 완전 분리 아키텍처**: 검출기 형상 및 민감 체적(Sensitive Volume) 메타데이터를 Python(`pyg4ometry`, `legend-pygeom-tools`)으로 생성한 표준 호환 확장 GDML 파일로 런타임에 로드하고, 입출력 데이터를 언어 독립적인 LEGEND HDF5(`LH5`) 표준 포맷으로 교환하여 C++ 코드 재작성 및 재컴파일 과정을 원천적으로 제거했습니다.\n- **저백그라운드 맞춤형 정점 샘플링 및 후처리 생태계**: 시료 내부(Bulk) 질량/동위원소 가중 샘플링뿐 아니라 표면 오염 및 가공에 의한 표면 하부 깊이 프로파일(지수·균일·절단 가우시안) 정점 샘플링을 내장하고, 추적 완료된 에너지 침적 데이터에 검출기 불감층 활성도 모델 및 펄스 파형/광학 맵을 반복 적용할 수 있는 후처리 도구(`reboost`)를 분리 구축했습니다.\n- **고속 시뮬레이션을 위한 조건부 추적(Conditional Tracking) 및 스텝 클러스터링**: HPGe 검출기에 에너지가 침적된 경우에만 액체 아르곤(LAr) 섬광 광자 및 원거리 전자를 추적하고 대기 트랙을 디스크 스크래치로 스필링(Spilling)하는 조건부 추적 기법을 도입하여 최대 170배의 연산 가속을 달성했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **소프트웨어 버전 및 기반** | `remage` v1.2.0, `Geant4` v11.3.2, `legend-pygeom-tools` v0.7.1 (GPL-3.0 라이선스, Docker 및 conda-forge 배포) |\n| **기하구조 및 입출력 인터페이스** | 입력: 확장 GDML (`RMG_detector`, `RMG_detector_meta`, `rmg_color`, `Region` 보조 태그 내장) / 출력: LEGEND HDF5 (`LH5`, Zstandard 압축 지원) |\n| **일차 사건 및 정점 생성기** | 내장 벌크/표면/깊이 프로파일 샘플러, `revertex`(외부 HDF5 정점 생성), `BxDecay0`(이중 베타 및 단일 핵종 붕괴), `EcoMug` 및 `MUSUN`(지상/지하 뮤온 플럭스) |\n| **핵심 물리 리스트 설정** | 전자기: `G4EmLivermorePhysics` (100 eV까지 저에너지 모델링, 형광·도플러 확장 포함) / 방사성 붕괴: 반감기 임계값 $10^{18}\\text{ s}$ ($\\approx 3.17 \\times 10^{10}\\text{ yr}$)로 확장하여 자연붕괴 계열 전체 추적, 감마 다단계 각상관 활성화 |\n| **생성 컷 및 스텝 클러스터링** | 기본 생성 컷(Production Cut): 전 입자 $0.1\\text{ mm}$ (Ge 내 전자 약 $175\\text{ keV}$, 감마 약 $6\\text{ keV}$) / 스텝 클러스터링: Ge 벌크 내 거리 $50\\text{ }\\mu\\text{m}$·시간 $10\\text{ }\\mu\\text{s}$ 이내 및 $10\\text{ keV}$ 미만 트랙 병합 (표면 $2\\text{ mm}$ 이내 불감층 영역은 비클러스터링 보존) |\n| **종단간 검증 실험 조건** | HADES 지하실험실 GERDA BEGe 검출기 특성화 데이터: $^{228}\\text{Th}$ 점선원 약 $6.3\\text{ kBq}$, 검출기 상단 $41\\text{ mm}$ 중심축 배치, 17시간 측정(품질 컷 후 유효 사건 84%) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **연산 속도 및 출력 용량 최적화**: 게르마늄 벌크 내 $1\\text{ MeV}$ 전자 시뮬레이션에서 기본 스텝 클러스터링($50\\text{ }\\mu\\text{m}$) 적용 시 물리적 해상도 손실 없이 CPU 연산 시간과 HDF5 출력 크기를 대폭 절감하였으며, 최대 스텝 제한($50\\text{--}200\\text{ }\\mu\\text{m}$)이 표면 불감층 전하 수집 효율(CCE) 가중 스펙트럼에 미치는 정량적 영향을 규명했습니다.\n- **조건부 추적에 의한 극적인 가속 성능**: HPGe 검출기에서 $50\\text{ cm}$ 떨어진 위치의 $2.6\\text{ MeV}$ 감마선 시뮬레이션(HPGe 트리거 임계값 $100\\text{ keV}$)에서 광학 광자만 지연 추적할 경우 **5배**, HPGe 표면 $10\\text{ cm}$ 외부의 전자와 광학 광자를 함께 지연 추적할 경우 **170배**의 시뮬레이션 속도 향상을 달성했습니다.\n- **HADES $^{228}\\text{Th}$ 실험 스펙트럼과의 일치성 검증**: 별도의 파라미터 튜닝 없이 `remage` 기본 물리 설정과 `reboost` 표면 활성도 모델만으로 HADES BEGe 검출기의 $^{228}\\text{Th}$ 스펙트럼을 재현한 결과, $300\\text{ keV}$ 이상의 전 에너지 대역에서 실험값과 시뮬레이션 간 잔차(Pull)가 $\\pm 3\\sigma$ 이내로 일치함을 확인했습니다.\n- **자동화된 CI/CD 물리 검증**: 매 코드 변경 및 Geant4 신규 버전 출시 시 자동 검증 스위트를 구동하여, 상위 버전(`Geant4` v11.4)의 중성자 포획 단면적 오류(Bug #2759) 및 광자 에너지 침적 시 비정상 섬광 생성 버그(Bug #2750)를 사전 탐지·보고하는 성과를 거두었습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **저에너지 영역($< 300\\text{ keV}$) 스펙트럼 편차**: 종단간 검증에서 $300\\text{ keV}$ 미만의 저에너지 영역에서는 일부 $3\\sigma$를 초과하는 편차가 나타나는데, 이는 입자 수송 물리 자체의 오차가 아니라 검출기 홀더/주변 물질의 기하학적 단순화, 선원 위치 불확도, 특히 저에너지 감마선에 민감한 $\\text{n}^+$ 접촉면 전이층(Transition Layer) 활성 부피 모델의 근사성에 기인합니다.\n- **조건부 추적 및 입자 필터링 사용 시 물리적 보존 주의**: 전자를 포함한 조건부 추적이나 특정 입자 제거 필터(`Particle Filtering`)는 에너지 보존 법칙을 깨뜨리거나 제동복사·광핵반응 등 2차 샤워에 의한 동위원소 생성 및 에너지 침적을 누락시킬 수 있으므로, 반드시 관심 물리 관측량에 대한 사전 타당성 검증 후 적용해야 합니다.", "converted_at": "2026-11-02T10:01:05.330166", "pdf_url": "raw/2026_remage_a_Geant4_based_simulation_framework_for_low_background_experiments.pdf", "transcribed_url": "transcribed/2026_remage_a_Geant4_based_simulation_framework_for_low_background_experiments.md", "summary_url": "summaries/2026_remage_a_Geant4_based_simulation_framework_for_low_background_experiments.md"}, {"id": "2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build", "year": "2026", "en_title": "Radiological characterisation and inter-laboratory comparison of naturally occurring radioactive materials (NORM) in building materials used in Ireland", "ko_title": "아일랜드 건축자재의 NORM 방사능 특성 평가 및 3개 기관 교차 검증", "journal": "Science of the Total Environment 1042 (2026) 181924", "authors": "R.E. Djabou, M. Dodek, C. Sainz, I. Fuente, L. Leon Vintró, O. Hanley, J. Goggins, M. Foley", "takeaway": "1964년 이전 주거지 철거 콘크리트 및 천연 골재, 시멘트 첨가제에 포함된 Ra-226, Th-232, K-40 농도를 평가함. 일반 콘크리트 및 모래 등 대다수 자재의 감마 지수(Gamma Index)는 0.4 이하로 EU 기준(1.0 이하)을 만족하여 순환 골재 재활용의 안전성을 확인하였으나, 특정 고방사능 채석장 골재는 기준치를 초과(약 2.0)하여 지질학적 사전 스크리닝이 필수적임을 입증함.", "tags": ["NORM", "건축자재", "감마분광", "Ra-226", "방사평형"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 천연방사성물질(NORM, 주로 U-238 및 Th-232 붕괴 계열, K-40)은 건축 자재에 보편적으로 존재하며, 실내 감마선 피폭 및 라돈 방출을 유발할 수 있습니다.\n- **핵심 문제 (Problem & Gap)**: 아일랜드 건축 자재에 대한 NORM 농도 기초 데이터가 매우 부족하며, 특히 순환 경제 정책에 따른 철거 폐콘크리트의 순환 골재 재활용 시 방사선학적 안전성 검증이 미흡했습니다.\n- **연구 목표**: 아일랜드 내 천연 골재, 모래, 플라스터, 1964년 이전 주거 철거 폐콘크리트, 시멘트 첨가제의 Ra-226, Th-232, K-40 농도를 정량화하고, 3개 공인 기관 간 분석 재현성을 검증하며, EU 감마 지수($I_\\gamma$) 기준 적합성을 평가합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **국가 차원의 다기관 교차 검증**: 아일랜드 환경청(EPA), 더블린 대학교(UCD), 스페인 칸타브리아 대학교(UC) 등 3개 독립 분석기관이 동일 시료를 교차 측정하여 높은 분석 신뢰성을 입증한 최초의 다단계 벤치마크 연구입니다.\n- **순환 골재 재활용 안전성 입증**: 1964년 이전 철거 주거지에서 채취한 폐콘크리트 시료를 체계적으로 분석하여 재활용 가능성을 학술적으로 입증했습니다.\n- **입도별 핵종 분포 분석**: 파쇄 및 분쇄 입도(Fractionation)가 방사능 농도 편차에 미치는 영향을 다각도로 검증했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **분석 대상 핵종** | $^{226}\\text{Ra}$ ($^{214}\\text{Pb}$, $^{214}\\text{Bi}$ 경유), $^{232}\\text{Th}$ ($^{228}\\text{Ac}$, $^{212}\\text{Pb}$, $^{208}\\text{Tl}$ 경유), $^{40}\\text{K}$ |\n| **계측 장비** | 고순도 게르마늄 감마선 분광기 (HPGe: EPA 70%, UCD 19%, UC 20% 상대효율) |\n| **시료 매트릭스** | 상업용 골재, 건설 모래, 철거 콘크리트, 플라스터, 고로슬래그미분말(GGBS), 플라이애시, 수입 세라믹 타일 |\n| **시료 전처리** | 건조 후 $<1\\text{ mm}$ 미분쇄, 250 mL 표준 용기 밀봉 후 28일 이상 보관 (라돈 영속평형 형성) |\n| **규제 판정 기준** | 유럽연합 방사선 방호 지침 (EU-BSS) 감마 지수: $I_\\gamma = \\frac{C_{\\text{Ra}}}{300} + \\frac{C_{\\text{Th}}}{200} + \\frac{C_{\\text{K}}}{3000} \\le 1.0$ (무제한 사용 기준) |\n| **적용 보정** | 동시합산 보정(TCS), 시료 자가흡수 보정 (GESPECOR, EFFTRAN, Genie 2000 활용) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **대다수 자재의 안전성 확인**: 콘크리트, 모래, 플라스터 및 일반 골재의 감마 지수는 **$I_\\gamma \\le 0.4$**로 EU 규제 기준($1.0$ 이하)을 크게 밑돌아, 철거 콘크리트의 순환 골재 재활용이 방사선학적으로 매우 안전함을 입증했습니다.\n- **핵종별 농도 범위**:\n  - $^{226}\\text{Ra}$: $5.5 \\sim 169\\text{ Bq}\\cdot\\text{kg}^{-1}$\n  - $^{232}\\text{Th}$: 검출한계 미만 $\\sim 206\\text{ Bq}\\cdot\\text{kg}^{-1}$\n  - $^{40}\\text{K}$: $5.4 \\sim 1155\\text{ Bq}\\cdot\\text{kg}^{-1}$\n- **고방사능 이상 골재 식별**: 특정 채석장에서 채취한 골재에서 **$I_\\gamma \\approx 2.0 \\pm 0.03$**의 높은 수치가 검출되어, 골재 상업 채취 전 지질학적 사전 스크리닝의 필요성이 확인되었습니다.\n- **입도 영향 미미**: 콘크리트 분쇄 입도($<1.18\\text{ mm}$, $1.18\\text{--}2\\text{ mm}$, $>2\\text{ mm}$)에 따른 방사능 농도 차이는 통계적으로 유의미하지 않았습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **라돈 방출율 직접 측정 부재**: 실내 피폭 평가는 감마선 지수 기반의 간접 평가이며, 자재 표면의 라돈($^{222}\\text{Rn}$) 기체 직접 방출율은 측정되지 않았습니다.\n- **지역 지질학적 국한성**: 천연 골재의 방사능 특성은 아일랜드 고유 지질 구조(Tellus 데이터)에 종속되므로 타 국가나 다른 지질대에 일반화하기 어렵습니다.", "converted_at": "2026-10-02T14:59:46.447352", "pdf_url": "raw/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.pdf", "transcribed_url": "transcribed/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.md", "summary_url": "summaries/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.md"}, {"id": "2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ", "year": "2025", "en_title": "Results of the joint IAEA/EEAE Intercomparison exercise on radioanalytical characterization of NORM samples in the European region", "ko_title": "유럽 21개국 31개 분석기관 NORM 상호비교 숙련도 시험 (IAEA/EEAE)", "journal": "Radiation Protection Dosimetry 201(3) (2025) 223–246", "authors": "Konstantinos Karfopoulos, Filipa Domingos, Govert de With, Bogusław Michalik, H. Burçin Okyar, Christos Maramathas, Nikos Salpadimos", "takeaway": "유럽 21개국 31개 방사분석 기관을 대상으로 인산염 광석 및 인산석고 시료를 배포하여 숙련도를 비교 평가함. 화학 공정을 거친 NORM 시료에서 우라늄/토륨 붕괴 계열의 방사평형 불평형(Disequilibrium)을 간과한 것이 주요 분석 오차 원인으로 규명됨. 특히 실험실의 공식 ISO/IEC 17025 공인 인증 여부가 NORM 분석의 정확도와 통계적으로 비례하지 않음을 입증함.", "tags": ["NORM", "감마분광", "숙련도시험", "체렌코프", "Ra-226"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 인산 비료 제조 등 다양한 산업 공정에서 발생하는 천연방사성물질(NORM) 잔재물(예: 인산석고)은 화학적 침출 및 분리 과정에서 고유의 방사평형이 교란됩니다.\n- **핵심 문제 (Problem & Gap)**: 다수의 방사분석 기관이 NORM 평가 시 U-238 및 Th-232 붕괴 계열이 영속평형(Secular Equilibrium) 상태에 있다고 잘못 가정하여 심각한 분석 오차가 발생하고 있습니다.\n- **연구 목표**: 유럽 21개국 31개 공인 방사화학 실험실의 NORM 핵종 분석 역량을 감마선 분광법, 알파 분광법, 액체섬광계수법(LSC) 전반에 걸쳐 교차 평가하고, 계통 오차의 핵심 원인을 규명합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **유럽 최대 규모의 NORM 상호비교 시험**: IAEA 기술협력 프로젝트(RER/9/155) 지원 하에 유럽 지역에서 NORM 매트릭스를 대상으로 실시된 가장 포괄적인 공인 숙련도 시험(ICE)입니다.\n- **실제 산업 공정 복합 시료 활용**: 인공 조작된 표준물이 아닌, 실제 공정에서 채취한 인산염 광석(PO)과 인산석고(PG) 시료를 직접 배포하여 실제 복합 매트릭스 효과를 검증했습니다.\n- **공인 인증과 분석 정확도의 괴리 규명**: 실험실의 공식 ISO/IEC 17025 시험기관 인정(Accreditation) 여부가 NORM 분석의 실제 정확도(Trueness)를 보장하지 못한다는 사실을 실증 데이터로 증명했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **분석 대상 핵종** | $^{40}\\text{K}$, $^{238}\\text{U}$, $^{226}\\text{Ra}$, $^{210}\\text{Pb}$, $^{232}\\text{Th}$, $^{228}\\text{Ra}$, $^{228}\\text{Th}$ |\n| **배포 시료 매트릭스** | 인산염 광석 (Phosphate Ore: 수분 $1.3\\%$), 인산석고 (Phosphogypsum: 수분 $28.7\\%$) |\n| **참여 기관 규모** | 유럽 21개 회원국 31개 전문 방사분석 실험실 |\n| **적용 분석 기술** | 고분해능 감마선 분광법(HRGS), 알파선 분광법, 방사화학 분리 후 액체섬광계수법(LSC) |\n| **균질도 검증 기준** | 광에너지 게르마늄 검출기(BEGe, $\\sim 50\\%$ 상대효율), $186$, $609$, $1764\\text{ keV}$ 피크 합산 계수 평가 |\n| **통계 평가 지표** | ISO 13528 기준 숙련도 평가: $z$-scores (정확도/진도), $\\zeta$-scores (적합성/호환성) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **방사평형 붕괴로 인한 오차**: 인산석고의 경우 황산 반응 시 라듐은 석고 침전물로 이동하는 반면 우라늄은 인산 용액으로 분리되어 극심한 U/Ra 불평형이 발생합니다. 초기 우라늄 자손 핵종으로 Ra-226을 추정하거나 라돈 평형 대기시간을 준수하지 않은 실험실에서 대규모 오차가 집중되었습니다.\n- **인증 여부와의 무관성**: 통계 분석 결과 ISO 공인 인증을 보유한 실험실과 비인증 전문 실험실 간의 합격률($z$-score 합격 범위) 차이가 유의미하지 않았습니다.\n- **핵심 계통 오차 요인**:\n  1. 라돈 영속평형 형성 대기시간($\\ge 28\\text{일}$) 미준수\n  2. $^{208}\\text{Tl}$, $^{214}\\text{Bi}$ 등 캐스케이드 감마 방출체에 대한 동시합산 보정(TCS) 누락\n  3. 밀도가 높은 인산염 광석 매트릭스의 자가흡수(Self-attenuation) 보정 미흡\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **자율 보고 범위에 따른 표본 편차**: 보고 핵종과 분석 기법을 각 실험실 자율에 맡겨, 감마선 분광법에 비해 알파 분광법 및 LSC 데이터 표본 수가 상대적으로 적었습니다.\n- **수분 정규화 오차**: 인산석고의 높은 수분 함량($28.7\\%$)으로 인해 $80^\\circ\\text{C}$ 건조 과정에서 기관별 건조 질량 측정 편차가 2차 불확도로 작용했습니다.", "converted_at": "2026-10-02T14:59:43.106261", "pdf_url": "raw/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.pdf", "transcribed_url": "transcribed/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.md", "summary_url": "summaries/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.md"}, {"id": "2025_Overview_of_naturally_occurring_radioactive_materials_NORM_in_mineral_processing_industries_and_consideration_of_ionisin", "year": "2025", "en_title": "Overview of naturally occurring radioactive materials (NORM) in mineral processing industries and consideration of ionising radiation in life cycle assessment – Part I. NORM inventory", "ko_title": "유럽 5대 광물 가공 산업의 NORM 전 주기 인벤토리 및 전과정평가(LCA) 고려사항 (Part I)", "journal": "Radiation and Environmental Biophysics 64 (2025) 611–627", "authors": "Alla Dvorzhak, Raffaella Ugolini, Gennaro Venoso, Federica Leonardi, Boguslaw Michalik, Almudena Real, Alicia Escribano, Danyl Pérez-Sánchez, Nathalie Vanhoudt, Antti Kallio, Cristina Nuccetteli, Flavio Trotti, Rosabianca Trevisi, Laureline Fevrier, Jelena Mrdakovic Popic", "takeaway": "유럽 RadoNorm 프로젝트를 통해 인산 제조, 인산·칼륨 비료, 지르코늄(내화물·타일), 시멘트, 이산화티타늄(TiO2) 안료 등 5대 광물 가공 산업의 원료–주제품–잔류물–배출물 전 주기에 걸친 자연방사성핵종(NOR) 인벤토리를 구축함. 배관 스케일(Ra-226 최대 90 kBq/kg, Th-232 최대 493.7 kBq/kg) 및 고온 용융로 분진(Po-210 최대 126 kBq/kg, Pb-210 최대 187 kBq/kg) 등 고농축 잔류물과 외주 유지보수·폐기물 처리 작업자의 피폭 사각지대를 규명하고, 순환경제 전과정평가(LCA)에 전리방사선 영향 범주를 통합하기 위한 정량 기반을 확립함.", "tags": ["NORM", "Pb-210/Bi-210", "Ra-226"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 유럽 기본안전기준(EU BSS, Directive 2013/59/Euratom) 도입으로 자연기원 방사성 물질(NORM) 취급 산업에 대한 차등적 규제 관리가 의무화되었으며, 순환경제(Circular Economy) 전환에 따라 산업 부산물의 재활용 시 방사선학적 안전성 평가가 중요해졌습니다.\n- **핵심 문제 (Problem & Gap)**: 기존 전과정평가(LCA, Life Cycle Assessment) 프레임워크에서는 기후변화 및 화학적 독성과 달리 자연 방사성 핵종(NOR)에 의한 전리방사선 영향 범주가 거의 고려되지 못했으며, 원료 광석부터 공정 중간물, 최종 제품, 잔류물(스케일·슬러지·분진) 및 배출물에 이르는 전 생산 주기의 체계적인 방사능 농도 인벤토리가 부족했습니다.\n- **연구 목표**: 유럽 RadoNorm 프로젝트(2022–2024)의 일환으로 유럽 주요 5대 광물 가공 산업(인산 제조, 인산·칼륨 비료, 지르코늄 및 내화물, 시멘트, 이산화티타늄 안료)의 전 주기 핵종별 방사능 농도 인벤토리를 구축하고, EU BSS 면제/해제 기준 초과 지점 및 작업자 피폭 취약 시나리오를 규명하여 향후 LCA 전리방사선 영향 평가(Part II)의 기초 데이터베이스를 확립합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **5대 핵심 광물 가공 산업의 전 주기(Full Production Cycle) 방사능 인벤토리 통합**: 벨기에, 핀란드, 프랑스, 이탈리아, 노르웨이, 폴란드, 스페인 등 유럽 7개국 실측 데이터와 e-NORM 설문 결과를 종합하여 원료–주제품–잔류물–유출수/배기가스 단계별 $^{238}\\text{U}$, $^{226}\\text{Ra}$, $^{210}\\text{Pb}$, $^{210}\\text{Po}$, $^{232}\\text{Th}$, $^{228}\\text{Ra}$, $^{228}\\text{Th}$, $^{40}\\text{K}$ 농도 범위를 정량 비교했습니다.\n- **순환경제 및 외부 하청 작업자(Secondary Processes)의 규제 사각지대 발굴**: 생산 공장 내부뿐 아니라 폐기물 매립지 작업자, 시멘트 킬른 스케일 제거 외주 작업자, 유리 용해로용 지르코늄 내화 벽돌 해체 작업자 등 EU BSS Annex VI의 직접 목록에서 누락되기 쉬운 2차 공정 작업자의 피폭 관리 필요성을 구체화했습니다.\n- **화학적 공정의 동위원소 분별(Fractionation) 및 시간에 따른 비평형 붕괴 예측 원칙 제시**: 고온 소성 시 $^{210}\\text{Pb}$·$^{210}\\text{Po}$의 휘발 농축과 습식 산 침출 시 $^{226}\\text{Ra}$·$^{228}\\text{Ra}$의 스케일 침전 등 공정별 분별 메커니즘을 정리하고, 비평형 상태 잔류물의 장기 처분/재활용 평가를 위한 연속 붕괴 예측(예: 초기 순수 라듐 스케일에서 시간 경과에 따른 자핵종 재성장과 $^{228}\\text{Th}/^{232}\\text{Th} \\ge 0.4$ 물리적 하한선) 기준을 제시했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **조사 대상 및 참여국** | 유럽 RadoNorm 프로젝트 참여 7개국(스페인 CIEMAT, 이탈리아 ARPAV/ISS/INAIL, 폴란드 GIG-PIB, 벨기에 SCK CEN, 핀란드 STUK, 프랑스 ASNR, 노르웨이 DSA) 및 범유럽 e-NORM 서베이 (2022–2024 수집) |\n| **평가 대상 5대 산업군** | (1) 인산($\\text{H}_3\\text{PO}_4$) 제조, (2) 인산 및 칼륨 비료 제조, (3) 지르코늄(내화물·세라믹·타일) 산업, (4) 시멘트 제조, (5) 이산화티타늄($\\text{TiO}_2$) 안료 제조 |\n| **핵심 규제 기준치 (EU BSS)** | 고체 NORM 면제/해제 수준(EL/CL): $^{238}\\text{U}$ 및 $^{232}\\text{Th}$ 계열 핵종 **$1\\text{ kBq}\\cdot\\text{kg}^{-1}$**, $^{40}\\text{K}$ **$10\\text{ kBq}\\cdot\\text{kg}^{-1}$** / 유효선량 기준: **$1\\text{ mSv}\\cdot\\text{y}^{-1}$** / 작업장 라돈 참조수준: **$300\\text{ Bq}\\cdot\\text{m}^{-3}$** |\n| **인산 및 비료 산업 매트릭스** | 원료: 모로코/튀니지 퇴적 인광석, 콜라 화성암, 칼륨염(Potash) / 제품: 54% $\\text{P}_2\\text{O}_5$ 인산, MAP, DAP, NPK, KCl(MOP) / 잔류물: 인산석고(PG), 배관 스케일, 슬러지, $\\text{CaF}_2$ 슬러지 |\n| **지르코늄 및 $\\text{TiO}_2$ 매트릭스** | 지르콘사($\\text{ZrSiO}_4$), 산화지르코늄($\\text{ZrO}_2$), 실리카 흄, 일메나이트(Ilmenite), 루틸(Rutile), 용융로 분진, 수화석회, 필터 잔류물, 탱크 라이닝 및 적색석고(Red Gypsum) |\n| **시멘트 공정 매트릭스** | 석회석, 철질 첨가제, 고로슬래그, 석탄회(Fly Ash), 원료분(Raw Flour), 클링커(Clinker), CEM II/A-V 42.5R 시멘트, 킬른 오븐 스케일 및 바이패스 분진 |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **인산 및 비료 산업**: 모로코산 퇴적 인광석 원료는 $^{238}\\text{U}$ 및 $^{226}\\text{Ra}$가 각각 $1.2\\text{--}1.7\\text{ kBq}\\cdot\\text{kg}^{-1}$로 기준치를 초과하는 반면, 러시아 콜라 화성암 원료는 $0.07\\text{--}0.08\\text{ kBq}\\cdot\\text{kg}^{-1}$로 낮았습니다. 인산 1톤당 약 5톤씩 발생하는 인산석고(PG, 전 세계 연간 $100\\text{--}280\\text{ Mt}$ 발생, 58% 적치·28% 해양배출·14% 재활용)는 $^{226}\\text{Ra}$가 최대 $1.1\\text{ kBq}\\cdot\\text{kg}^{-1}$ 수준이나, 소량 발생하는 배관 스케일에서는 $^{226}\\text{Ra}$가 비료 공정에서 최대 **$90.0\\text{ kBq}\\cdot\\text{kg}^{-1}$**, 고체 슬러지에서 **$4.9\\text{ kBq}\\cdot\\text{kg}^{-1}$**까지 농축되었습니다. 또한 완제품 비료 중 MAP/DAP는 $^{238}\\text{U}$가 $1.5\\text{--}2.0\\text{ kBq}\\cdot\\text{kg}^{-1}$, 염화칼륨(MOP)은 천연 칼륨 고유 성분으로 인해 $^{40}\\text{K}$가 $13.8\\text{--}16.5\\text{ kBq}\\cdot\\text{kg}^{-1}$로 나타났습니다.\n- **지르코늄(내화물·타일) 산업**: 원료인 지르콘사($^{226}\\text{Ra}$ $1.2\\text{--}23.5$, $^{238}\\text{U}$ $1.1\\text{--}5.6\\text{ kBq}\\cdot\\text{kg}^{-1}$)와 $\\text{ZrO}_2$($^{238}\\text{U}$ $3.2\\text{--}13.4\\text{ kBq}\\cdot\\text{kg}^{-1}$) 모두 기준치를 크게 상회합니다. 특히 $>1900\\text{ }^\\circ\\text{C}$ 고온 용융 공정에서 휘발성 핵종이 농축되어 용융로 분진(Fusion furnace dust)에서 $^{210}\\text{Pb}$ **$21\\text{--}37\\text{ kBq}\\cdot\\text{kg}^{-1}$**, $^{210}\\text{Po}$ **$35\\text{--}126\\text{ kBq}\\cdot\\text{kg}^{-1}$**의 극고농도가 검출되었고, 타일 소성 배기가스 처리용 수화석회에서도 $^{210}\\text{Po}$가 **$5\\text{--}46\\text{ kBq}\\cdot\\text{kg}^{-1}$**에 달했습니다.\n- **이산화티타늄($\\text{TiO}_2$) 안료 산업**: 최종 $\\text{TiO}_2$ 제품은 방사능이 극미량($<0.2\\text{ kBq}\\cdot\\text{kg}^{-1}$)이나, 공정 스케일에서 $^{232}\\text{Th}$ 최대 **$493.7\\text{ kBq}\\cdot\\text{kg}^{-1}$** ($^{228}\\text{Ra}$ $37.0$, $^{210}\\text{Pb}$ $37.4$, $^{226}\\text{Ra}$ $25.0\\text{ kBq}\\cdot\\text{kg}^{-1}$), 필터 잔류물에서 $^{210}\\text{Pb}$ 최대 **$187.0\\text{ kBq}\\cdot\\text{kg}^{-1}$** ($^{210}\\text{Po}$ $133.0\\text{ kBq}\\cdot\\text{kg}^{-1}$), 결정화기(Crystallizer) 내부 라돈 가스 약 **$1000\\text{ Bq}\\cdot\\text{m}^{-3}$**가 보고되어 유지보수 시 강제 환기가 필수적임이 확인되었습니다.\n- **시멘트 산업**: 원료와 최종 시멘트 제품은 모두 EU BSS 면제 기준 미만이었으나, 고온 킬른 내부 클링커 스케일(Clinker scale in oven)에서 휘발·응축에 의해 $^{210}\\text{Pb}$ 최대 **$1.4\\text{ kBq}\\cdot\\text{kg}^{-1}$**, $^{210}\\text{Po}$ 최대 **$2.0\\text{ kBq}\\cdot\\text{kg}^{-1}$**로 면제 기준($1\\text{ kBq}\\cdot\\text{kg}^{-1}$)을 초과했습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **시료 이력(Sample Age) 부재에 따른 방사평형 오판 주의**: 수집된 산업 잔류물 데이터는 시료 생성 시점(경과 시간) 정보가 없는 경우가 많아, 화학 공정 직후 모핵종과 분리된 $^{226}\\text{Ra}$·$^{228}\\text{Ra}$ 침전물 등에서 단기·중기 자핵종($^{228}\\text{Th}$, $^{210}\\text{Pb}$, $^{210}\\text{Po}$)의 재성장(Ingrowth)에 따른 시간별 방사능 변화를 반드시 동역학적으로 예측해야 합니다.\n- **액체·기체 배출물 데이터 부족 및 단위 불일치**: 고체 잔류물에 비해 액체 및 기체 유출물 데이터는 매우 제한적이며, 국가·기관별로 농도($\\text{kBq}\\cdot\\text{kg}^{-1}$, $\\text{Bq}\\cdot\\text{m}^{-3}$) 또는 연간 총 배출량($\\text{Bq}\\cdot\\text{year}^{-1}$)으로 단위가 혼재되어 있어 향후 LCA 통합을 위한 측정 프로토콜 및 보고 단위의 국제적 표준화가 요구됩니다.", "converted_at": "2026-11-02T10:01:09.789082", "pdf_url": "raw/2025_Overview_of_naturally_occurring_radioactive_materials_NORM_in_mineral_processing_industries_and_consideration_of_ionisin.pdf", "transcribed_url": "transcribed/2025_Overview_of_naturally_occurring_radioactive_materials_NORM_in_mineral_processing_industries_and_consideration_of_ionisin.md", "summary_url": "summaries/2025_Overview_of_naturally_occurring_radioactive_materials_NORM_in_mineral_processing_industries_and_consideration_of_ionisin.md"}, {"id": "2025_Comparison_of_measurement_techniques_and_sorption_of_radium_226_in_low_and_high_salinity_aqueous_samples", "year": "2025", "en_title": "Comparison of measurement techniques and sorption of radium-226 in low and high salinity aqueous samples", "ko_title": "저염 및 고염 수용액 내 226Ra 3대 계측 기법(LSC, HPGe, ICP-MS) 비교 및 해양 기질 흡착 특성", "journal": "Applied Radiation and Isotopes 222 (2025) 111851", "authors": "Sarah E. Donaher, Jiusi Wang, Nicole E. Martinez, Brian A. Powell", "takeaway": "담수(0 PSU)와 인공 해수(35 PSU)에서 Ra-226 측정을 위한 LSC, HPGe(직접 계측 및 Empore SPE 디스크 농축), ICP-MS의 검출한계와 실용성을 비교함. 해수에서 SPE-HPGe는 과량 염류 경쟁으로 회수율이 4.7%로 급감하고, 가장 감도가 높은 LSC(Quantulus MDC 0.107 Bq/L)조차 6개월 보관 시 해수-섬광액 황변에 의한 색상 소광으로 검출한계가 2배 이상 악화됨을 최초 보고함. 이에 따라 고염 시료의 신속 분석에는 적절히 희석한 ICP-MS를 권장하며, 해양 광물 4종에 대한 배치 흡착 실험을 통해 점토·패각(이온교환, 해수에서 Kd 9~50배 감소)과 침철석(표면착화, 염분 무관 일정)의 거동 차이를 규명함.", "tags": ["감마분광", "체렌코프", "Ra-226", "효율교정", "방사평형"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 인산석고 적치장 유출수, 셰일가스 수압파쇄(Fracking) 고염 폐수($500\\text{--}700\\text{ Bq}\\cdot\\text{L}^{-1}$), 해양 석유 파이프라인 스케일($40\\text{--}1000\\text{ Bq}\\cdot\\text{g}^{-1}$) 등 인간 활동으로 인해 해양 및 기수역 환경에 유입되는 라듐($^{226}\\text{Ra}$)의 신속하고 정확한 모니터링이 요구됩니다.\n- **핵심 문제 (Problem & Gap)**: 기존 $^{226}\\text{Ra}$ 분석법 연구는 주로 담수(저염) 매트릭스에 집중되어 왔으며, 해수와 같은 고염분($35\\text{ PSU}$) 시료에서는 증발 농축이 불가능하고 과량의 경쟁 이온($\\text{Na}^+$, $\\text{Ca}^{2+}$, $\\text{Mg}^{2+}$)이 화학적 분리 수율 및 기기 감도를 급격히 저하시키는 문제가 있습니다.\n- **연구 목표**: 복잡한 전처리를 최소화한 3대 대표 계측 기법—액체섬광계수법(LSC), 고순도 게르마늄 감마선 분광법(HPGe, 직접 측정 및 SPE 디스크 추출), 사중극자 유도결합 플라즈마 질량분석법(ICP-MS)—을 담수($0\\text{ PSU}$)와 인공 해수($35\\text{ PSU}$) 시료에 동일하게 적용하여 검출한계(MDC/LOD), 분석 시간, 비용을 직접 비교하고, 해양 퇴적물 주요 광물 4종에 대한 $^{226}\\text{Ra}$ 분배계수($K_d$)에 미치는 염분의 영향을 규명합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **담수 대 해수 매트릭스의 3대 기기 직접 정량 비교**: 동일한 $^{226}\\text{Ra}$ 표준용액 계열을 사용하여 방사능 계측법(LSC, HPGe)과 질량분석법(ICP-MS)의 염분별 검출한계 및 매트릭스 억제 효과를 단일 연구 내에서 체계적으로 대조했습니다.\n- **고염분 LSC 칵테일의 장기 보관 황변(Yellow Discoloration) 및 소광 현상 최초 보고**: 해수($35\\text{ PSU}$)와 광유계 섬광액(Ultima Gold LLT) 혼합 표준시료를 6개월간 보관할 경우 심각한 황변 현상이 진행되어 색상 소광(Color Quenching)으로 인해 검출한계(MDC)가 2배 이상 악화됨을 최초로 규명했습니다.\n- **광물별 흡착 기작에 따른 염분 효과 차별성 규명**: 점토(몬모릴로나이트)와 패각(방해석)에서는 해수 조건에서 경쟁 이온에 의해 $K_d$가 급감(이온교환 지배)하는 반면, 침철석(Goethite)은 염분에 무관하게 일정한 $K_d$(내권 표면착화 지배)를 유지하고 석영(Quartz)은 해수에서 오히려 $K_d$가 2배 증가함을 실험적으로 입증했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **비교 매트릭스 및 표준선원** | 담수(DDI water, $0\\text{ PSU}$) 및 인공 해수(Instant Ocean, $35\\text{ PSU}$, $42\\text{ g}\\cdot\\text{L}^{-1}$), $2\\%\\text{ HNO}_3$ 산성화($\\text{pH} \\approx 1$), $^{226}\\text{Ra}$ 농도 범위 $3.7\\text{--}199,800\\text{ Bq}\\cdot\\text{L}^{-1}$ ($0.0001\\text{--}5.4\\text{ }\\mu\\text{g}\\cdot\\text{L}^{-1}$) |\n| **LSC 계측 조건** | 시료 $10\\text{ mL}$ + PerkinElmer Ultima Gold LLT 광유 섬광액 $10\\text{ mL}$, $^{222}\\text{Rn}$ 영속평형 도달을 위해 **30일 밀봉 보관** 후 Tri-Carb 4910 TR 및 Quantulus 1220 Ultra로 계측 (6개월 후 재계측 비교) |\n| **HPGe 감마 분광 조건** | Canberra GC 4018 HPGe ($^{226}\\text{Ra}$ $186.7\\text{ keV}$ ROI: $184.7\\text{--}187.8\\text{ keV}$, $^{152}\\text{Eu}$ 효율 교정, 24시간 측정): (1) $250\\text{ mL}$ 수용액 직접 측정, (2) $1\\text{ L}$ 시료를 Empore Radium SPE RAD Disk ($50\\text{ mL}\\cdot\\text{min}^{-1}$) 여과 후 측정 |\n| **ICP-MS 계측 조건** | ThermoScientific iCAP RQ (단일 사중극자), 전처리 없이 직접 주입, 다원자 이온 간섭 억제용 KED(운동에너지 변별) 모드 구동, 내부표준물질 $^{209}\\text{Bi}$, 블랭크 강제 선형 회귀 적용 |\n| **배치 흡착 실험 ($K_d$)** | 저염($10\\text{ mM NaCl}$) 대 고염($600\\text{ mM}$ 인공해수), 용액 $10\\text{ mL}$, $^{226}\\text{Ra}$ $185\\cdot 925\\cdot 1850\\text{ Bq}\\cdot\\text{L}^{-1}$, 고체상 4종: 석영($0.25\\text{ g}$), 분쇄 홍합 패각(방해석, $0.25\\text{ g}$), 몬모릴로나이트 점토($0.25\\text{ g}$), 침철석(Goethite, $0.05\\text{ g}$), 24시간 교반 및 $4500\\text{ rpm}$ 원심분리 |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **기법별 담수 대 해수 검출한계(MDC/LOD) 비교**:\n  - **LSC ($10\\text{ mL}$, 30일 배양)**: Quantulus 1220 기준 담수 **$0.070\\text{ Bq}\\cdot\\text{L}^{-1}$**, 해수 **$0.107\\text{ Bq}\\cdot\\text{L}^{-1}$**로 가장 낮은 검출한계를 달성했습니다(Tri-Carb 4910 기준 담수 $1.12$, 해수 $1.28\\text{ Bq}\\cdot\\text{L}^{-1}$). 그러나 **6개월 보관 후** Tri-Carb 재측정 시 담수 MDC는 $1.44\\text{ Bq}\\cdot\\text{L}^{-1}$로 소폭(28%) 증가한 반면, 해수 표준시료는 황변 현상으로 인해 계측 효율이 급락하며 MDC가 **$2.71\\text{ Bq}\\cdot\\text{L}^{-1}$**로 2배 이상 악화되었습니다.\n  - **HPGe ($24\\text{ h}$ 계측)**: $250\\text{ mL}$ 직접 계측 시 MDC는 **$6.29\\text{ Bq}\\cdot\\text{L}^{-1}$**였습니다. $1\\text{ L}$ Empore SPE 디스크 농축 시 담수에서는 **$0.27\\text{ Bq}\\cdot\\text{L}^{-1}$**의 우수한 검출한계를 보였으나, $35\\text{ PSU}$ 해수에서는 과량 염류 경쟁으로 $^{226}\\text{Ra}$ 회수율이 **$4.7 \\pm 0.4\\%$**로 급락하여 해수 MDC가 **$5.86\\text{ Bq}\\cdot\\text{L}^{-1}$**로 치솟았습니다.\n  - **ICP-MS (무희석 직접 주입)**: 담수 LOD는 **$0.41\\text{ Bq}\\cdot\\text{L}^{-1}$** ($11.14\\text{ pCi}\\cdot\\text{L}^{-1}$)였으나, 해수에서는 고농도 $\\text{Na}^+$ 등 이온화 용이 원소에 의한 플라즈마 감도 억제(신호 강도 약 25배 감소)로 인해 무희석 해수 LOD가 **$11.4\\text{ Bq}\\cdot\\text{L}^{-1}$**로 상승했습니다. 그럼에도 시료당 수 분 내 즉각 분석이 가능하므로, 신속 분석 시 적절한 희석을 동반한 ICP-MS가 최적 대안으로 제시되었습니다.\n- **염분에 따른 광물별 $^{226}\\text{Ra}$ 분배계수($K_d$) 변화**:\n  - 분쇄 패각(방해석)과 몬모릴로나이트 점토의 $K_d$는 $10\\text{ mM NaCl}$(담수 모사, 점토 $K_d \\approx 1691\\text{ L}\\cdot\\text{kg}^{-1}$) 대비 $600\\text{ mM}$ 인공해수에서 각각 **50배**($p = 0.07$) 및 **9배**($p = 0.04$) 감소했습니다.\n  - 반면 침철석(Goethite)은 담수와 해수에서 거의 동일한 $K_d$($437 \\pm 100\\text{ L}\\cdot\\text{kg}^{-1}$, $p = 0.99$)를 유지했으며, 석영(Quartz)은 해수에서 오히려 $K_d$가 **2배 증가**($p = 0.004$)했습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **해수 내 천연 우라늄($^{235}\\text{U}$) 감마선 간섭**: 실제 해수에는 약 $3.3\\text{ }\\mu\\text{g}\\cdot\\text{L}^{-1}$의 천연 우라늄이 존재하며, $^{235}\\text{U}$이 방출하는 $185.7\\text{ keV}$ 감마선이 $^{226}\\text{Ra}$의 $186.2\\text{ keV}$ 피크와 중첩되므로 실제 해양 시료의 HPGe 측정 시에는 영속평형 후 자핵종($^{214}\\text{Bi}$ $1764\\text{ keV}$ 등)을 병행 확인해야 합니다.\n- **고염 LSC 표준선원의 장기 재사용 불가**: 염분 $\\ge 20\\text{ PSU}$ 시료와 섬광액 혼합물은 시간 경과에 따라 비가역적 황변 열화가 진행되므로, LSC로 해수 시료를 정량할 때는 표준선원을 장기 보관하며 재사용할 수 없고 시료와 동일한 시점에 제조한 신선한 매트릭스 매칭 표준선원을 사용해야 합니다.", "converted_at": "2026-11-02T10:00:56.707427", "pdf_url": "raw/2025_Comparison_of_measurement_techniques_and_sorption_of_radium_226_in_low_and_high_salinity_aqueous_samples.pdf", "transcribed_url": "transcribed/2025_Comparison_of_measurement_techniques_and_sorption_of_radium_226_in_low_and_high_salinity_aqueous_samples.md", "summary_url": "summaries/2025_Comparison_of_measurement_techniques_and_sorption_of_radium_226_in_low_and_high_salinity_aqueous_samples.md"}, {"id": "2024_Recent_progresses_in_analytical_method_development_for_210Pb_in_environmental_and_biological_samples", "year": "2024", "en_title": "Recent progresses in analytical method development for 210Pb in environmental and biological samples", "ko_title": "환경 및 생체 시료 내 210Pb 분석법 개발 최신 동향 종합 리뷰", "journal": "Environmental Science and Pollution Research 31 (2024) 31664–31678", "authors": "Hong Ren, Xinyu Gong, Lei Zhou, Peng Wang, Yiyao Cao", "takeaway": "환경(토양·퇴적물·에어로졸·해수·먹는물) 및 생체(뼈·소변·수산물) 시료의 Pb-210 정량을 위한 전처리, 화학 분리·정제(Sr/DGA 수지 및 분리·선원 제작 일체형 PS 수지), 직·간접 계측 기법의 최근 10년간 발전상을 종합 정리함. 최고 감도를 제공하는 Po-210 알파 분광법(LOD 0.03~0.08 mBq, 단 6~9개월 재성장 대기 필요)부터 비파괴 46.5 keV 감마 분광법, 이온성 액체 파장 시프터를 결합한 LSC, 그리고 온라인 운모점 추출(CPE)로 검출한계를 13 mBq/L까지 낮춘 신속 ICP-MS 기법까지의 분석 성능과 핵심 제어 조건(500 °C 이하 회화, Ag 디스크 3시간 이내 석출 등)을 체계화함.", "tags": ["감마분광", "체렌코프", "이온성액체", "Pb-210/Bi-210", "Geant4/시뮬레이션"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 우라늄($^{238}\\text{U}$) 계열의 주요 붕괴 생성물인 $^{210}\\text{Pb}$(반감기 $22.3\\text{ yr}$)는 대기 중 $^{222}\\text{Rn}$ 붕괴 및 인산비료·석탄·우라늄 광산 활동을 통해 환경 전반에 확산되며, 인체 섭취 시 약 20%가 전신 대사로 흡수되어 골격·간·신장에 장기 축적되는 고독성 친골성(Bone-seeking) 핵종입니다. 또한 퇴적물 연대측정 및 사후경과시간(PMI) 추정의 핵심 추적자로 활용됩니다.\n- **핵심 문제 (Problem & Gap)**: 환경 및 생체 시료 내 $^{210}\\text{Pb}$ 농도는 극미량인 반면, 직접 방출하는 베타선($20\\text{ keV}$ 81%, $61\\text{ keV}$ 19%)과 감마선($46.5\\text{ keV}$, 분기비 4.25%)의 에너지가 모두 낮아 자가흡수 및 매트릭스 간섭이 심합니다. 기존 문헌들은 주로 환경 추적 응용에 치중되어 있어, 시료 전처리부터 화학 분리·정제, 선원 제작, 계측에 이르는 분석 전 과정의 최신 기술 발전을 종합 비교한 체계적 리뷰가 부재했습니다.\n- **연구 목표**: 최근 10여 년간 발표된 환경(토양, 퇴적물, 에어로졸, 해수, 먹는물) 및 생체(뼈, 소변, 수산물, 태선/이끼) 시료 내 $^{210}\\text{Pb}$ 분석법의 전처리–분리·정제–선원 제작–직·간접 계측 단계별 원리, 검출한계(LOD), 회수율 및 장단점을 비판적으로 종합하고 친환경 자동화 분석 트렌드를 제시합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **분석 전 주기(4단계 워크플로우) 통합 비교 체계 구축**: (1) 고체·액체 시료 전처리(마이크로파 산분해, 분별 회화, 알칼리 용융, 공침), (2) 화학 분리·정제(침전, 용매추출, 이온교환, 추출 크로마토그래피), (3) 계측기별 선원 제작, (4) 직접 계측($\\gamma$ 분광, LSC, ICP-MS) 및 간접 계측($^{210}\\text{Po}$ $\\alpha$ 분광, $^{210}\\text{Bi}$ $\\beta$ 계측)의 전 단계를 아우르는 의사결정 가이드를 확립했습니다.\n- **차세대 선택적 추출 수지(PS Resin) 및 온라인 유동 분석(LOV-MSFIA) 조명**: 화학 분리와 섬광 선원 제작을 단일 카트리지 단계로 통합하여 유기 폐액 발생을 없앤 플라스틱 섬광 수지(PS Resin)와, 운모점 추출(Cloud Point Extraction, CPE)을 결합해 ICP-MS의 $^{210}\\text{Pb}$ 검출한계를 $13\\text{ mBq}\\cdot\\text{L}^{-1}$까지 낮춘 최신 기법들을 심층 분석했습니다.\n- **실무적 오차 유발 요인(온도·자가흡수·석출 시간)의 정량적 가이드라인 정리**: 에어로졸 회화 시 납 휘발 방지를 위한 $500\\text{ }^\\circ\\text{C}$ 이하 단계별 승온 조건, 은(Ag) 디스크 자연석출 시 3시간 초과에 따른 산화막 스펙트럼 열화 현상 등 실험실 실무에서 즉각 활용 가능한 핵심 제어 변수를 집대성했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **고체 시료 전처리** | 산분해($\\text{HNO}_3 + \\text{HF} + \\text{HClO}_4 + \\text{HCl}$ 또는 마이크로파 $30\\text{ bar}$, $35\\text{ min}$), 난분해성 시료 알칼리 용융($\\text{Na}_2\\text{CO}_3 + \\text{Na}_2\\text{O}_2$, $500\\text{--}1000\\text{ }^\\circ\\text{C}$, 회수율 $^{210}\\text{Pb}$ $88.4 \\pm 7.1\\%$, $^{210}\\text{Po}$ $90.0 \\pm 9.8\\%$), 에어로졸 분별 회화($\\le 500\\text{ }^\\circ\\text{C}$ 다단 승온 + 붕산 보조) |\n| **액체 시료 전처리** | $0.4\\text{--}0.45\\text{ }\\mu\\text{m}$ 여과 후 $\\text{pH } 1\\text{--}2$ 산성화, 대용량 수시료 $\\text{Fe(OH)}_3$ 또는 $\\text{MnO}_2$ 공침($\\text{KMnO}_4 + \\text{MnCl}_2$, 흡착률 $>85\\%$), 소변 시료($90\\text{ mL}$) 진한 $\\text{HNO}_3$ 마이크로파 분해 |\n| **이온교환 및 추출 크로마토그래피** | 음이온 교환(DOWEX $1\\times 8$, $1.0\\text{ M HCl}$ 흡착, $1.8\\text{ M H}_2\\text{SO}_4$로 $^{210}\\text{Bi}$ 용리, 수율 $80 \\pm 10\\%$) / 양이온 교환(AG 50W$\\times$8: $0.2\\text{ M HCl}$ Po $\\rightarrow$ $0.4\\text{ M HCl}$ Bi $\\rightarrow$ $2\\text{ M HCl}$ Pb 순차 용리, 수율 Pb $84.3\\%$, Bi $87\\%$, Po $92\\%$) / **Sr Resin**(크라운 에테르계: $6\\text{ M HNO}_3$ Po 용리, $6\\text{ M HCl}$ Pb 용리) / **PS Resin**($8\\text{ M HNO}_3$로 Po 분리 후 $^{210}\\text{Pb}/^{90}\\text{Sr}$ 카트리지 직접 LSC 계측) |\n| **선원 제작 프로토콜** | $\\alpha$ 분광: 고순도(99.99%) Ag 디스크 상 $80\\text{--}96\\text{ }^\\circ\\text{C}$ 수욕조 자연석출($\\le 3\\text{ h}$ 권장) 또는 $\\text{CuS}$/Te 미세침전 / LSC: 색상 소광이 큰 $\\text{PbCrO}_4$ 대신 옥살산납($\\text{PbC}_2\\text{O}_4$) 침전 후 묽은 $\\text{HNO}_3$ 용해 또는 이온성 액체(살리실산염 음이온) 파장 시프터 활용 체렌코프 직접 계측 / $\\beta$ 계측: $\\text{PbSO}_4$ 침전 후 $^{210}\\text{Bi}$ 재성장(5일~1개월) 대기 |\n| **간접 계측법 사양** | (1) **$\\alpha$ 분광법**($^{210}\\text{Po}$ 경유): LOD $0.1\\text{ mBq}\\cdot\\text{g}^{-1}$ 또는 $0.03\\text{--}0.08\\text{ mBq}$ ($0.7\\text{--}16\\text{ mBq}\\cdot\\text{L}^{-1}$), $^{210}\\text{Po}$ 재성장 **6~9개월** 소요 / (2) **저백그라운드 $\\beta$ 계측법**($^{210}\\text{Bi}$ 경유): LOD $\\sim 8\\text{ mBq}$ ($0.92\\text{ Bq}\\cdot\\text{kg}^{-1}$, $4.3\\text{ mBq}\\cdot\\text{L}^{-1}$), 대기 기간 약 5일~1개월 |\n| **직접 계측법 사양** | (1) **$\\gamma$ 분광법**($46.5\\text{ keV}$, Well-type HPGe): 비파괴, LOD $18.9\\text{ Bq}\\cdot\\text{kg}^{-1}$ (또는 $\\text{MnO}_2$ 섬유 농축 시 $0.01\\text{ Bq}\\cdot\\text{L}^{-1}$) / (2) **LSC**: LOD $0.85\\text{ Bq}\\cdot\\text{L}^{-1}$ ($38.0\\text{ mBq}\\cdot\\text{g}^{-1}$) / (3) **ICP-MS**: 시료당 수 분 소요, 일반 LOD $45\\text{--}90\\text{ mBq}\\cdot\\text{L}^{-1}$, 온라인 CPE 결합 시 **$13\\text{ mBq}\\cdot\\text{L}^{-1}$** ($0.35\\text{ L}$ 시료) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **극미량 정밀 분석 대 신속 스크리닝의 성능 트레이드오프 규명**:\n  - **최고 감도(극저준위 환경/생체 시료)**: $^{210}\\text{Po}$ 자연석출 기반 알파 분광법이 검출한계 $0.03\\text{--}0.08\\text{ mBq}$ ($0.1\\text{ mBq}\\cdot\\text{g}^{-1}$)로 베타 계측법($\\sim 8\\text{ mBq}$)보다 100배 이상, 감마 분광법보다 수천 배 높은 압도적 감도를 제공합니다.\n  - **최단 시간(비상 대응 및 대량 시료)**: ICP-MS는 계측 시간을 수 분 이내로 단축하며, 최근 순차 운모점 추출(Sequential CPE) 온라인 결합을 통해 물 시료 $0.35\\text{ L}$만으로 $13\\text{ mBq}\\cdot\\text{L}^{-1}$의 검출한계를 달성하여 방사계측법과의 감도 격차를 빠르게 좁히고 있습니다.\n- **LSC 효율 향상 및 비평형 보정 혁신**: Strok et al.(2016)의 $^{210}\\text{Bi}$ 재성장 효율 보정 모델은 화학 분리 직후 임의의 시점에 즉시 LSC 계측을 가능케 하여 검출 효율을 2배 향상시켰으며, 살리실산염 기반 이온성 액체(3-MPS 등) 파장 시프터 도입은 상용 칵테일 없이도 체렌코프 계측 효율을 대폭 개선했습니다.\n- **고온 전처리 및 석출 시간의 임계 조건**: 에어로졸 및 생체 시료 회화 시 $500\\text{ }^\\circ\\text{C}$를 초과하면 납 휘발 손실이 급증하므로 단계별 승온($110 \\rightarrow 200 \\rightarrow 300 \\rightarrow 450 \\rightarrow 500\\text{ }^\\circ\\text{C}$)이 필수적이며, 은 디스크 상 폴로늄 자연석출 시간이 **3시간**을 초과하면 표면 산화물 피막 형성으로 알파 피크 분해능이 오히려 저하됨을 확인했습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **알파 분광법($^{210}\\text{Po}$ 경유)의 치명적 시간 지연 및 수율 평가 한계**: 초기 잔류 폴로늄($^{209}\\text{Po}$ 추적자 포함)을 음이온 교환 수지(DOWEX 등)로 완전히 제거한 뒤 $^{210}\\text{Pb}$로부터 $^{210}\\text{Po}$가 재성장하기까지 **6~9개월**을 기다려 2차 석출해야 하므로 긴급 분석에 부적합하며, 폴로늄의 용기 벽면 흡착 손실과 별도의 안정 납(Stable Pb) ICP-MS 측정 없이는 Pb 자체의 화학 수율을 직접 알 수 없다는 한계가 있습니다.\n- **직접 감마 분광법의 자가흡수 보정 필수성**: $46.5\\text{ keV}$ 감마선은 낮은 분기비(4.25%)와 매트릭스 밀도·원소 조성에 따른 극심한 광자 자가흡수(Self-absorption)를 겪으므로, 반경험적 방법 또는 몬테카를로 시뮬레이션을 통한 정밀 자가흡수 보정 없이는 심각한 과소평가가 발생합니다.", "converted_at": "2026-11-02T10:01:00.524825", "pdf_url": "raw/2024_Recent_progresses_in_analytical_method_development_for_210Pb_in_environmental_and_biological_samples.pdf", "transcribed_url": "transcribed/2024_Recent_progresses_in_analytical_method_development_for_210Pb_in_environmental_and_biological_samples.md", "summary_url": "summaries/2024_Recent_progresses_in_analytical_method_development_for_210Pb_in_environmental_and_biological_samples.md"}, {"id": "2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors", "year": "2024", "en_title": "A new methodology for efficiency calibration of uncharacterized Ge detectors by using characterized Ge detectors", "ko_title": "특성 미규명 HPGe 검출기의 효율 교정을 위한 신 방법론", "journal": "Radiation Physics and Chemistry 221 (2024) 111763", "authors": "A. Barba-Lobo, V.M. Expósito-Suárez, J.A. Suárez-Navarro, J.P. Bolívar", "takeaway": "제조사 전산모사 모델이 없는 미규명 고순도 게르마늄(HPGe) 검출기를 표준선원 없이 정밀 교정하는 기법을 개발함. 이미 특성화된 검출기의 시뮬레이션 효율과 미규명 검출기의 실험 효율 간의 비율(FEPER)이 시료 두께, 밀도, 화학 조성에 무관하게 일정하게 유지된다는 사실을 수학적/실험적으로 증명하여, 단일 기준 시료만으로 임의의 형상과 밀도에 대한 계측 효율을 산출할 수 있게 함.", "tags": ["감마분광", "숙련도시험", "Geant4/시뮬레이션", "효율교정", "방사평형"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 감마선 분광 분석에서 다양한 시료 매트릭스, 채움 높이, 용기 형상에 따른 전에너지 피크 효율(FEPE, $\\epsilon$)의 정밀한 결정은 환경 방사능 측정의 핵심 필수 요소입니다.\n- **핵심 문제 (Problem & Gap)**: 몬테카를로 전산모사(LabSOCS, MCNP, Geant4 등)는 표준선원 제작을 생략할 수 있으나, 고가의 제조사 특성화(Characterization) 모델이 반드시 필요합니다. 특성 모델이 없는 미규명 검출기는 수많은 형상마다 표준물질을 실험적으로 측정해야 해 막대한 시간과 비용이 소모됩니다.\n- **연구 목표**: 특성화된 검출기와 미규명 검출기 사이의 수학적 효율 전달 비율을 확립하여, 단 하나의 기준 시료만으로 임의의 형상과 매트릭스에 대해 미규명 HPGe 검출기의 실제 계측 효율($\\epsilon^{\\text{exp}}$)을 정확히 산출하는 방법론을 개발 및 검증합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **FEPER 불변성 원리 최초 규명**: 특성화 검출기의 시뮬레이션 효율과 미규명 검출기의 실험 효율 간의 비율($\\text{FEPER} = \\epsilon^{\\text{sim}} / \\epsilon^{\\text{exp}}$)이 시료 두께($h$), 겉보기 밀도($\\rho$), 화학 조성에 무관하게 일정하다는 사실을 최초로 증명했습니다.\n- **단일 기준선원 기반 범용 교정**: 에너지($E_\\gamma$)별 FEPER 곡선을 천연 인산염 암석(PR) 시료 하나로 단 한 번 도출해 두면, 향후 임의의 시료 매트릭스에 대해 실험적 자가흡수 보정 없이 즉시 효율을 결정할 수 있습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **비교 대상 검출기** | Mirion XtRa 동축형 HPGe 3기: DET-1 ($42.1\\%$ 상대효율, 특성화), DET-2 ($115.7\\%$ 상대효율, 특성화), DET-3 ($38.4\\%$ 상대효율, 미규명) |\n| **전산모사 도구** | LabSOCS 및 Geometry Composer (v4.4.1), Beaker Editor를 통한 용기 수치 모델링 |\n| **기준 교정 시료** | 천연 인산염 암석 (PR): 불화인회석 매트릭스, 밀도 $\\rho \\approx 1.6\\text{ g}\\cdot\\text{cm}^{-3}$, U-238 계열 영속평형 ($1569\\text{ Bq}\\cdot\\text{kg}^{-1}$) |\n| **테스트 지오메트리** | 원통형 4종 (C29, C36, C50, C72: 직경 $29.0 \\sim 71.8\\text{ mm}$), 마리넬리 비커 2종 (M121, M128: 직경 $120 \\sim 128\\text{ mm}$) |\n| **분석 에너지 대역** | $46\\text{ keV}$ ($^{210}\\text{Pb}$) 부터 $1765\\text{ keV}$ ($^{214}\\text{Bi}$) 까지 총 8개 대표 감마선 에너지 |\n| **검증용 복합 매트릭스** | IAEA RGU-1 규사 ($\\text{SiO}_2$, 밀도 $1.6$), 금속 주석 시료 ($\\text{Sn}$, 밀도 $3.5\\text{ g}\\cdot\\text{cm}^{-3}$), 인산석고 (PG, 밀도 $1.3$) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **지오메트리 불변성 검증**: 원통형 형상(C29~C72) 전반에서 DET-1/DET-3의 $\\text{FEPER}$ 비율은 $0.9$($46\\text{--}63\\text{ keV}$)에서 $1.2$($609\\text{--}1120\\text{ keV}$) 사이로 시료 높이에 무관하게 극도로 안정적이었습니다.\n- **밀도 및 조성 독립성**: 인산석고($1.3\\text{ g}\\cdot\\text{cm}^{-3}$)부터 고밀도 금속 주석($3.5\\text{ g}\\cdot\\text{cm}^{-3}$)까지 극한의 밀도 범위에서도 FEPER 값이 일치하여 자가흡수 보정 인자가 완벽히 상쇄됨($f_a^{\\text{sim}} = f_a^{\\text{exp}}$)을 확인했습니다.\n- **동시합산(TCS) 보정 명확화**: $609$, $1120$, $1765\\text{ keV}$에서 관측된 일부 편차는 검출기 결정 크기에 따른 순수 동시합산 효과 차이로 정확히 분리 모델링되었습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **검출기 구조 정렬 전제**: 본 연구는 동일한 연장범위 동축형(XtRa) 게르마늄 결정 기술 간에 검증되었으며, 웰형(Well-type)이나 평면형(Planar) 등 결정 기하구조가 완전히 상이한 검출기 간 교차 적용 시에는 별도 형상 보정이 요구됩니다.\n- **저에너지 마리넬리 비커 편차**: 마리넬리 형상의 경우 재진입 웰 구조의 급격한 자가흡수로 인해 $150\\text{ keV}$ 이하 극저에너지에서 미세한 오차가 발생할 수 있습니다.", "converted_at": "2026-10-02T14:59:38.257748", "pdf_url": "raw/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.pdf", "transcribed_url": "transcribed/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.md", "summary_url": "summaries/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.md"}, {"id": "2022_In_Search_for_an_Ionic_Liquid_with_the_Best_Performance_during_210Pb_210Bi_Cherenkov_Counting_in_Waters_on_an_LS_Counter", "year": "2022", "en_title": "In Search for an Ionic Liquid with the Best Performance during 210Pb/210Bi Cherenkov Counting in Waters on an LS Counter", "ko_title": "체렌코프 계측을 이용한 수중 210Pb/210Bi 측정과 이온성 액체 파장 시프터", "journal": "International Journal of Environmental Research and Public Health 19 (2022) 16563", "authors": "Ivana Stojković, Milan Vraneš, Teona Teodora Borović, Nataša Todorović, Jovana Nikolov, Milka Zečević, Slobodan Gadžurić, Simona Mancini", "takeaway": "먹는물 모니터링 대상인 수중 극미량 Pb-210을 액체섬광계수기(Quantulus 1220)의 체렌코프 광으로 고감도 측정하기 위해 신규 이온성 액체를 파장 시프터로 도입함. [Bmim][Sal]을 0.5 g 이상 첨가할 경우 검출 효율이 기존 15% 수준에서 60% 이상으로 대폭 향상됨을 확인하였으며, DFT 양자 시뮬레이션을 통해 살리실레이트 음이온의 ortho-수산화기 구조가 파장 이동을 유발하는 핵심 기작임을 규명함.", "tags": ["감마분광", "체렌코프", "이온성액체", "Pb-210/Bi-210", "효율교정"], "summary_md": "### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 수환경에서 $^{210}\\text{Pb}$ ($T_{1/2} = 22.3\\text{년}$) 농도 측정은 먹는물 방사선 기준치($0.1\\text{ Bq}\\cdot\\text{L}^{-1}$) 감시 및 해양학적 유기탄소 입자 침강 플럭스 추적에 필수적입니다.\n- **핵심 문제 (Problem & Gap)**: 연베타 방출체인 $^{210}\\text{Pb}$는 감마선 분광법 적용 시 방출 확률이 극히 낮고 자가흡수가 심해 검출한계가 높으며, 알파 분광법은 수개월의 평형 대기시간이, 기존 액체섬광계수법(LSC)은 화학적/색상 소광(Quenching) 보정 문제가 따릅니다.\n- **연구 목표**: 화학적 전처리 없이, 비휘발성 친환경 이온성 액체(IL)를 파장 시프터(Wavelength Shifter)로 첨가하여 액체섬광계수기에서 직접 체렌코프 광 계측 효율을 극대화하는 방안을 규명합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **고효율 신규 섬광 이온성 액체 규명**: 이미다졸륨 계열 이온성 액체 5종을 합성 및 스크리닝하여, $[\\text{Bmim}][\\text{Sal}]$ (1-butyl-3-methylimidazolium salicylate)이 기존 물질 대비 월등한 효율 향상을 이끌어냄을 발견했습니다.\n- **양자화학 분자 시뮬레이션 메커니즘 규명**: 방사분석 실험과 밀도범함수이론(DFT) 계산을 결합하여, 체렌코프 자외선을 가시광으로 변환하는 파장 이동 효과가 오직 살리실레이트 음이온의 *ortho*-수산화기 입체 구조에 의해 발현됨을 최초로 입증했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **측정 대상 핵종 쌍** | $^{210}\\text{Pb}$ (연베타체, 체렌코프 미발생) $\\rightarrow$ 딸핵종 $^{210}\\text{Bi}$ ($E_{\\beta,\\text{max}} = 1162\\text{ keV}$, 고에너지 체렌코프 광 방출) |\n| **계측 장비** | Wallac/PerkinElmer Quantulus $1220^{\\text{TM}}$ 극저준위 액체섬광계수기 (능동/수동 비스무트 가드 차폐) |\n| **계측 용기 (Vials)** | 저확산 Super Polyethylene (PE) $20\\text{ mL}$ 바이알 (유리 바이알의 $^{40}\\text{K}$ 백그라운드 원천 배제) |\n| **합성 이온성 액체** | $[\\text{Bmim}][\\text{Sal}]$, $[\\text{Bmim}][\\text{Ben}]$, $[\\text{Bmim}][3\\text{HB}]$, $[\\text{Bmim}][4\\text{HB}]$, $[\\text{HPA}][\\text{Sal}]$ |\n| **양자 시뮬레이션** | Jaguar 9.0 (DFT B3LYP-D3/6-31+G(d,p)), 연속체 용매화 모델, Fukui 함수 기반 스핀 밀도 해석 |\n| **영속평형 대기시간** | 표준 첨가 시료를 $\\ge 50\\text{일}$ 이상 보관하여 $^{210}\\text{Pb}/^{210}\\text{Bi}$ 영속평형 형성 완결 후 측정 |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **압도적인 검출 효율 상승**: $[\\text{Bmim}][\\text{Sal}]$을 $0.5\\text{ g}$ 이상 첨가 시 기존 $[\\text{HPA}][\\text{Sal}]$ 대비 훨씬 가파른 계측 효율 상승을 기록하며, 기준 효율($\\sim 15\\%$)에서 **$60\\%$ 이상**으로 검출 효율이 비약적으로 증가했습니다.\n- **음이온 입체 구조의 절대성**: 벤조에이트($[\\text{Ben}]$)나 *meta*-, *para*-치환 하이드록시벤조에이트($[3\\text{HB}]$, $[4\\text{HB}]$)는 파장 이동 효과가 전혀 없었으며, 오직 *ortho* 위치에 수산화기가 결합된 살리실레이트만이 PMT 감도 대역으로 체렌코프 광을 시프팅시켰습니다.\n- **소광 현상 없는 저백그라운드 유지**: 유기 섬광 칵테일을 쓰지 않아 화학적 소광이 발생하지 않으며, 초저준위 배경 계수율을 유지하여 환경 수질 시료의 최소검출방사능(MDA)을 대폭 낮췄습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **영속평형 대기 필수**: 비스무트 화학 분리를 생략할 수 있으나, 정확한 정량을 위해서는 시료 채취 후 최소 $40 \\sim 50\\text{일}$간의 $^{210}\\text{Pb}/^{210}\\text{Bi}$ 방사평형 도달 대기시간이 반드시 요구됩니다.\n- **색상 소광 위험**: 탁도나 유기물 색상이 짙은 실제 환경수 시료의 경우 체렌코프 광 흡수로 인한 색상 소광(Color quenching)이 발생할 수 있어 탈색 전처리나 보정이 필요합니다.", "converted_at": "2026-10-02T14:59:35.002955", "pdf_url": "raw/2022_In_Search_for_an_Ionic_Liquid_with_the_Best_Performance_during_210Pb_210Bi_Cherenkov_Counting_in_Waters_on_an_LS_Counter.pdf", "transcribed_url": "transcribed/2022_In_Search_for_an_Ionic_Liquid_with_the_Best_Performance_during_210Pb_210Bi_Cherenkov_Counting_in_Waters_on_an_LS_Counter.md", "summary_url": "summaries/2022_In_Search_for_an_Ionic_Liquid_with_the_Best_Performance_during_210Pb_210Bi_Cherenkov_Counting_in_Waters_on_an_LS_Counter.md"}];

            <span class="card-journal">${p.journal || ""}</span>
          </div>
          <div class="card-title-ko">${displayKoTitle}</div>
          <div class="card-title-en">${p.en_title}</div>
          <div class="card-tags">${tagsHtml}</div>
        `;
        cardListContainer.appendChild(card);
      });

      renderDetailPane();
    }

    function selectPaper(paperId) {
      currentPaperId = paperId;
      document.querySelectorAll(".paper-card").forEach(c => c.classList.remove("active"));
      renderCardList();
      const detailBody = document.getElementById("detailBody");
      if (detailBody) detailBody.scrollTop = 0;
    }

    function renderDetailPane() {
      const paper = PAPERS.find(p => p.id === currentPaperId);
      if (!paper) return;

      dhYear.textContent = paper.year;
      dhJournal.textContent = paper.journal || "Journal / Conference";
      dhTitleKo.textContent = paper.ko_title || paper.en_title;
      dhTitleEn.textContent = paper.en_title;
      dhAuthorsText.textContent = paper.authors || "저자 정보 미기재";

      if (dhSourceLinks) {
        if (SHOW_SOURCE_LINKS && (paper.transcribed_url || paper.pdf_url)) {
          dhSourceLinks.style.display = "inline-flex";
          if (dhTranscribedBtn) {
            dhTranscribedBtn.href = paper.transcribed_url || "#";
            dhTranscribedBtn.style.display = paper.transcribed_url ? "inline-flex" : "none";
          }
          if (dhPdfBtn) {
            dhPdfBtn.href = paper.pdf_url || "#";
            dhPdfBtn.style.display = paper.pdf_url ? "inline-flex" : "none";
          }
        } else {
          dhSourceLinks.style.display = "none";
        }
      }

      paneSummary.innerHTML = safeMarkdown(paper.summary_md || "*요약문이 없습니다.*");
      renderMathInElementSafely(paneSummary);
    }

    // Chips Filter Events
    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        const type = chip.dataset.filterType;
        const val = chip.dataset.value;

        if (type === "year") {
          document.querySelectorAll("#yearFilterChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          selectedYear = val;
        } else if (type === "tag") {
          document.querySelectorAll("#tagFilterChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          selectedTag = val;
        }

        renderCardList();
      });
    });

    // Search Input Event
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderCardList();
    });

    // Shortcut Ctrl+K
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Citation Copy
    copyCitationBtn.addEventListener("click", () => {
      const paper = PAPERS.find(p => p.id === currentPaperId);
      if (!paper) return;
      const citation = `${paper.authors} (${paper.year}). "${paper.en_title}". ${paper.journal || ""}`;
      navigator.clipboard.writeText(citation).then(() => {
        const prevText = copyCitationBtn.textContent;
        copyCitationBtn.textContent = "인용 복사 완료";
        setTimeout(() => copyCitationBtn.textContent = prevText, 2000);
      });
    });

    // Toggle Left Master Pane (List Collapse/Expand)
    const toggleMasterBtn = document.getElementById("toggleMasterBtn");
    const toggleMasterIcon = document.getElementById("toggleMasterIcon");
    const toggleMasterText = document.getElementById("toggleMasterText");
    const appContainer = document.querySelector(".app-container");

    if (toggleMasterBtn) {
      toggleMasterBtn.addEventListener("click", () => {
        const isCollapsed = appContainer.classList.toggle("master-collapsed");
        toggleMasterIcon.textContent = isCollapsed ? "▶" : "◀";
        toggleMasterText.textContent = "논문 목록";
      });
    }

    // Immediate & Safe Initialization
    function initApp() {
      renderCardList();
      setTimeout(() => {
        renderMathInElementSafely(paneSummary);
      }, 300);
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
