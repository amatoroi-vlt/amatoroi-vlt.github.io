<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방사선 계측 및 NORM 연구 논문 아카이브 대시보드</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600;700;800&family=Noto+Serif+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Marked.js for High-Performance Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>

  <style>
    :root {
      --bg-ground: #0a0e17;
      --bg-panel: #111827;
      --bg-card: #172033;
      --bg-card-hover: #1e293b;
      --bg-card-active: #1e2d4a;
      --border-subtle: #2d3748;
      --border-focus: #3b82f6;
      --ink-base: #e2e8f0;
      --ink-muted: #94a3b8;
      --ink-heading: #f8fafc;
      --accent-primary: #38bdf8;
      --accent-subtle: rgba(56, 189, 248, 0.12);
      --accent-gold: #fbbf24;
      --accent-green: #34d399;
      --accent-purple: #c084fc;
      --tag-bg: #1e293b;
      --tag-border: #334155;
      --tag-text: #94a3b8;
      --tag-active-bg: rgba(56, 189, 248, 0.2);
      --tag-active-border: #38bdf8;
      --tag-active-text: #38bdf8;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      --font-serif: 'Noto Serif KR', Georgia, serif;
      --font-mono: 'IBM Plex Mono', Menlo, Consolas, monospace;
      --header-height: 72px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-ground);
      color: var(--ink-base);
      font-family: var(--font-sans);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation / Header */
    header {
      height: var(--header-height);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      gap: 1.5rem;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .brand-badge {
      background: var(--accent-subtle);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--ink-heading);
      letter-spacing: -0.02em;
    }

    .search-box-wrapper {
      flex: 1;
      max-width: 460px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0.6rem 1rem 0.6rem 2.4rem;
      color: var(--ink-heading);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
      background: #172642;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .search-icon {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ink-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: var(--ink-muted);
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-family: var(--font-mono);
    }

    .stat-pill b {
      color: var(--accent-primary);
    }

    /* Main Container (Master - Detail Layout) */
    .app-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Left Pane: Master List */
    .master-pane {
      width: 380px;
      min-width: 320px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .filter-bar {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(8px);
    }

    .filter-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
    }

    .chips-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      max-height: 80px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .chip {
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      transition: all 0.15s ease;
      user-select: none;
    }

    .chip:hover {
      border-color: var(--ink-muted);
      color: var(--ink-base);
    }

    .chip.active {
      background: var(--tag-active-bg);
      border-color: var(--tag-active-border);
      color: var(--tag-active-text);
      font-weight: 600;
    }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      scrollbar-width: thin;
    }

    .paper-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      position: relative;
    }

    .paper-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .paper-card.active {
      background: var(--bg-card-active);
      border-color: var(--accent-primary);
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.15);
    }

    .paper-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      background: var(--accent-primary);
      border-radius: 0 4px 4px 0;
    }

    .card-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .card-year-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-primary);
      background: var(--accent-subtle);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
    }

    .card-journal {
      font-size: 0.75rem;
      color: var(--accent-gold);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-style: italic;
    }

    .card-title-ko {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ink-heading);
      line-height: 1.4;
    }

    .card-title-en {
      font-size: 0.8rem;
      color: var(--ink-muted);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.25rem;
    }

    .card-tag {
      font-size: 0.68rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--ink-muted);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: var(--font-mono);
    }

    /* Right Pane: Detail View */
    .detail-pane {
      flex: 1;
      background: var(--bg-ground);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .detail-header {
      padding: 1.5rem 2rem 1.25rem;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .detail-top-badges {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .badge-year {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
    }

    .badge-journal {
      color: var(--accent-gold);
      font-size: 0.85rem;
      font-style: italic;
      font-weight: 500;
    }

    .detail-title-ko {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink-heading);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .detail-title-en {
      font-size: 1rem;
      color: var(--ink-muted);
      line-height: 1.4;
      font-weight: 400;
    }

    .detail-authors {
      font-size: 0.85rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--ink-base);
      transition: all 0.15s ease;
      font-family: var(--font-sans);
    }

    .action-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
    }

    /* Detail Content Scroll Area */
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 2.2rem 2.5rem 4rem;
      line-height: 1.75;
      scrollbar-width: thin;
    }

    .summary-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .content-pane {
      display: none;
      max-width: 900px;
      margin: 0 auto;
    }

    .content-pane.active {
      display: block;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Markdown Rendered Typography */
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      font-family: var(--font-serif);
      color: var(--ink-heading);
      margin-top: 2rem;
      margin-bottom: 0.85rem;
      line-height: 1.35;
    }

    .markdown-body h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border-subtle); padding-bottom: 0.6rem; }
    .markdown-body h2 { font-size: 1.35rem; color: var(--accent-primary); border-left: 3px solid var(--accent-primary); padding-left: 0.75rem; margin-top: 2.5rem; }
    .markdown-body h3 { font-size: 1.15rem; color: #f1f5f9; }

    .markdown-body p {
      margin-bottom: 1.15rem;
      color: #cbd5e1;
      font-size: 0.96rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.25rem;
      padding-left: 1.6rem;
      color: #cbd5e1;
    }

    .markdown-body li {
      margin-bottom: 0.45rem;
    }

    .markdown-body strong {
      color: #f8fafc;
      font-weight: 700;
    }

    .markdown-body blockquote {
      background: rgba(30, 41, 59, 0.6);
      border-left: 4px solid var(--accent-primary);
      padding: 1rem 1.25rem;
      border-radius: 0 8px 8px 0;
      margin: 1.25rem 0;
      font-style: normal;
      color: #e2e8f0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.88rem;
      background: var(--bg-card);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-subtle);
    }

    .markdown-body th {
      background: #1e293b;
      color: var(--ink-heading);
      padding: 0.85rem 1rem;
      text-align: left;
      font-weight: 700;
      border-bottom: 2px solid var(--border-subtle);
    }

    .markdown-body td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
    }

    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      margin: 1.5rem 0;
      display: block;
      background: #0f172a;
    }

    .markdown-body code {
      font-family: var(--font-mono);
      background: #1e293b;
      color: var(--accent-gold);
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      font-size: 0.85em;
    }

    .markdown-body pre {
      background: #0f172a;
      border: 1px solid var(--border-subtle);
      padding: 1.2rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 1.25rem 0;
    }

    .markdown-body pre code {
      background: none;
      padding: 0;
      color: var(--ink-base);
    }

    .markdown-body a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .markdown-body a:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: var(--accent-primary);
      color: #7dd3fc;
      transform: translateY(-1px);
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--ink-muted);
      text-align: center;
      gap: 1rem;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    @media (max-width: 900px) {
      .app-container {
        flex-direction: column;
      }
      .master-pane {
        width: 100%;
        height: 40vh;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
      }
      .detail-pane {
        height: 60vh;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-badge">RESEARCH ARCHIVE</span>
      <h1 class="brand-title">방사선 계측 &amp; NORM 연구 논문 저장소</h1>
    </div>

    <div class="search-box-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="논문 제목, 저자, 키워드, 내용 검색 (Ctrl + K)...">
    </div>

    <div class="stats-bar">
      <div class="stat-pill">총 보관 <b>4편</b></div>
    </div>
  </header>

  <!-- App Body -->
  <div class="app-container">
    
    <!-- Left Master List Pane -->
    <aside class="master-pane">
      <div class="filter-bar">
        <div class="filter-label">연도별 필터</div>
        <div class="chips-wrapper" id="yearFilterChips">
          <div class="chip active" data-filter-type="year" data-value="ALL">전체 (4)</div>
          <div class="chip" data-filter-type="year" data-value="2026">2026</div><div class="chip" data-filter-type="year" data-value="2025">2025</div><div class="chip" data-filter-type="year" data-value="2024">2024</div><div class="chip" data-filter-type="year" data-value="2022">2022</div>
        </div>

        <div class="filter-label" style="margin-top: 0.2rem;">주제별 태그</div>
        <div class="chips-wrapper" id="tagFilterChips">
          <div class="chip active" data-filter-type="tag" data-value="ALL">전체 태그</div>
          <div class="chip" data-filter-type="tag" data-value="NORM">#NORM</div><div class="chip" data-filter-type="tag" data-value="Pb-210/Bi-210">#Pb-210/Bi-210</div><div class="chip" data-filter-type="tag" data-value="감마분광">#감마분광</div><div class="chip" data-filter-type="tag" data-value="건축자재">#건축자재</div><div class="chip" data-filter-type="tag" data-value="방사선안전/규제">#방사선안전/규제</div><div class="chip" data-filter-type="tag" data-value="방사평형">#방사평형</div><div class="chip" data-filter-type="tag" data-value="숙련도시험">#숙련도시험</div><div class="chip" data-filter-type="tag" data-value="이온성액체">#이온성액체</div><div class="chip" data-filter-type="tag" data-value="체렌코프">#체렌코프</div><div class="chip" data-filter-type="tag" data-value="효율교정">#효율교정</div>
        </div>
      </div>

      <div class="card-list" id="cardListContainer">
        <!-- Rendered dynamically by JS -->
      </div>
    </aside>

    <!-- Right Detail Pane -->
    <main class="detail-pane" id="detailPane">
      
      <!-- Detail Header -->
      <div class="detail-header" id="detailHeader">
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem;">
          <div style="display: flex; flex-direction: column; gap: 0.5rem; flex: 1;">
            <div class="detail-top-badges">
              <span class="badge-year" id="dhYear">2026</span>
              <span class="badge-journal" id="dhJournal">Journal Name</span>
            </div>
            <h2 class="detail-title-ko" id="dhTitleKo">논문 제목 (한글)</h2>
            <div class="detail-title-en" id="dhTitleEn">Paper Full Title in English</div>
            <div class="detail-authors" id="dhAuthors">
              <span>✍️</span> <span id="dhAuthorsText">저자 정보</span>
            </div>
          </div>
          <button class="action-btn" id="copyCitationBtn" title="인용 정보 복사">
            📋 인용 복사
          </button>
        </div>
      </div>

      <!-- Detail Content Body -->
      <div class="detail-body">
        <div class="summary-wrapper markdown-body" id="paneSummary">
          <!-- Rendered Structured Summary -->
        </div>
      </div>

    </main>

  </div>

  <script>
    const PAPERS = [{"id": "2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build", "year": "2026", "en_title": "Radiological characterisation and inter-laboratory comparison of naturally occurring radioactive materials (NORM) in building materials used in Ireland", "ko_title": "아일랜드 건축자재의 NORM 방사능 특성 평가 및 3개 기관 교차 검증", "journal": "*Science of the Total Environment 1042 (2026) 181924*", "authors": "R.E. Djabou", "takeaway": "1964년 이전 주거지 철거 콘크리트 및 천연 골재, 시멘트 첨가제에 포함된 Ra-226, Th-232, K-40 농도를 평가함. 일반 콘크리트 및 모래 등 대다수 자재의 감마 지수(Gamma Index)는 0.4 이하로 EU 기준(1.0 이하)을 만족하여 순환 골재 재활용의 안전성을 확인하였으나, 특정 고방사능 채석장 골재는 기준치를 초과(약 2.0)하여 지질학적 사전 스크리닝이 필수적임을 입증함.", "tags": ["NORM", "건축자재", "감마분광", "방사평형", "방사선안전/규제"], "summary_md": "# Radiological characterisation and inter-laboratory comparison of naturally occurring radioactive materials (NORM) in building materials used in Ireland\n\n- **발행연도**: 2026\n- **주요저자**: [\"R.E. Djabou\"]\n- **문서링크**: [원문 전사본 전문 보기](assets/papers/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.md) | [원본 PDF 열기](assets/papers/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build/2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.pdf)\n\n---\n\n## 심층 구조화 분석 (Tier 2 Deep Structural Summary)\n\n### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 천연방사성물질(NORM, 주로 U-238 및 Th-232 붕괴 계열, K-40)은 건축 자재에 보편적으로 존재하며, 실내 감마선 피폭 및 라돈 방출을 유발할 수 있습니다.\n- **핵심 문제 (Problem & Gap)**: 아일랜드 건축 자재에 대한 NORM 농도 기초 데이터가 매우 부족하며, 특히 순환 경제 정책에 따른 철거 폐콘크리트의 순환 골재 재활용 시 방사선학적 안전성 검증이 미흡했습니다.\n- **연구 목표**: 아일랜드 내 천연 골재, 모래, 플라스터, 1964년 이전 주거 철거 폐콘크리트, 시멘트 첨가제의 Ra-226, Th-232, K-40 농도를 정량화하고, 3개 공인 기관 간 분석 재현성을 검증하며, EU 감마 지수($I_\\gamma$) 기준 적합성을 평가합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **국가 차원의 다기관 교차 검증**: 아일랜드 환경청(EPA), 더블린 대학교(UCD), 스페인 칸타브리아 대학교(UC) 등 3개 독립 분석기관이 동일 시료를 교차 측정하여 높은 분석 신뢰성을 입증한 최초의 다단계 벤치마크 연구입니다.\n- **순환 골재 재활용 안전성 입증**: 1964년 이전 철거 주거지에서 채취한 폐콘크리트 시료를 체계적으로 분석하여 재활용 가능성을 학술적으로 입증했습니다.\n- **입도별 핵종 분포 분석**: 파쇄 및 분쇄 입도(Fractionation)가 방사능 농도 편차에 미치는 영향을 다각도로 검증했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **분석 대상 핵종** | $^{226}\\text{Ra}$ ($^{214}\\text{Pb}$, $^{214}\\text{Bi}$ 경유), $^{232}\\text{Th}$ ($^{228}\\text{Ac}$, $^{212}\\text{Pb}$, $^{208}\\text{Tl}$ 경유), $^{40}\\text{K}$ |\n| **계측 장비** | 고순도 게르마늄 감마선 분광기 (HPGe: EPA 70%, UCD 19%, UC 20% 상대효율) |\n| **시료 매트릭스** | 상업용 골재, 건설 모래, 철거 콘크리트, 플라스터, 고로슬래그미분말(GGBS), 플라이애시, 수입 세라믹 타일 |\n| **시료 전처리** | 건조 후 $<1\\text{ mm}$ 미분쇄, 250 mL 표준 용기 밀봉 후 28일 이상 보관 (라돈 영속평형 형성) |\n| **규제 판정 기준** | 유럽연합 방사선 방호 지침 (EU-BSS) 감마 지수: $I_\\gamma = \\frac{C_{\\text{Ra}}}{300} + \\frac{C_{\\text{Th}}}{200} + \\frac{C_{\\text{K}}}{3000} \\le 1.0$ (무제한 사용 기준) |\n| **적용 보정** | 동시합산 보정(TCS), 시료 자가흡수 보정 (GESPECOR, EFFTRAN, Genie 2000 활용) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **대다수 자재의 안전성 확인**: 콘크리트, 모래, 플라스터 및 일반 골재의 감마 지수는 **$I_\\gamma \\le 0.4$**로 EU 규제 기준($1.0$ 이하)을 크게 밑돌아, 철거 콘크리트의 순환 골재 재활용이 방사선학적으로 매우 안전함을 입증했습니다.\n- **핵종별 농도 범위**:\n  - $^{226}\\text{Ra}$: $5.5 \\sim 169\\text{ Bq}\\cdot\\text{kg}^{-1}$\n  - $^{232}\\text{Th}$: 검출한계 미만 $\\sim 206\\text{ Bq}\\cdot\\text{kg}^{-1}$\n  - $^{40}\\text{K}$: $5.4 \\sim 1155\\text{ Bq}\\cdot\\text{kg}^{-1}$\n- **고방사능 이상 골재 식별**: 특정 채석장에서 채취한 골재에서 **$I_\\gamma \\approx 2.0 \\pm 0.03$**의 높은 수치가 검출되어, 골재 상업 채취 전 지질학적 사전 스크리닝의 필요성이 확인되었습니다.\n- **입도 영향 미미**: 콘크리트 분쇄 입도($<1.18\\text{ mm}$, $1.18\\text{--}2\\text{ mm}$, $>2\\text{ mm}$)에 따른 방사능 농도 차이는 통계적으로 유의미하지 않았습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **라돈 방출율 직접 측정 부재**: 실내 피폭 평가는 감마선 지수 기반의 간접 평가이며, 자재 표면의 라돈($^{222}\\text{Rn}$) 기체 직접 방출율은 측정되지 않았습니다.\n- **지역 지질학적 국한성**: 천연 골재의 방사능 특성은 아일랜드 고유 지질 구조(Tellus 데이터)에 종속되므로 타 국가나 다른 지질대에 일반화하기 어렵습니다.\n", "has_pdf": true, "pdf_name": "2026_Radiological_characterisation_and_inter_laboratory_comparison_of_naturally_occurring_radioactive_materials_NORM_in_build.pdf", "pdf_size": "1.4 MB", "converted_at": "2026-10-02T14:59:46.447352"}, {"id": "2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ", "year": "2025", "en_title": "Results of the joint IAEA/EEAE Intercomparison exercise on radioanalytical characterization of NORM samples in the European region", "ko_title": "유럽 21개국 31개 분석기관 NORM 상호비교 숙련도 시험 (IAEA/EEAE)", "journal": "*Radiation Protection Dosimetry 201(3) (2025) 223–246*", "authors": "Results of the joint IAEA/EEAE Intercomparison exercise on radioanalytical characterization of NORM samples in the European region Konstantinos Karfopoulos1, Filipa Domingos2, Govert de With3, Bogusław Michalik4, H. Burçin Okyar5, Christos Maramathas6, Nikos Salpadimos1", "takeaway": "유럽 21개국 31개 방사분석 기관을 대상으로 인산염 광석 및 인산석고 시료를 배포하여 숙련도를 비교 평가함. 화학 공정을 거친 NORM 시료에서 우라늄/토륨 붕괴 계열의 방사평형 불평형(Disequilibrium)을 간과한 것이 주요 분석 오차 원인으로 규명됨. 특히 실험실의 공식 ISO/IEC 17025 공인 인증 여부가 NORM 분석의 정확도와 통계적으로 비례하지 않음을 입증함.", "tags": ["NORM", "감마분광", "숙련도시험", "체렌코프", "방사평형"], "summary_md": "# Results of the joint IAEA/EEAE Intercomparison exercise on radioanalytical characterization of NORM samples in the European region\n\n- **발행연도**: 2025\n- **주요저자**: [\"**Results of the joint IAEA/EEAE Intercomparison exercise on radioanalytical characterization of NORM samples in the European region Konstantinos Karfopoulos****1** **\", \"Filipa Domingos****2\", \"*** **\", \"Govert de With****3** **\", \"Bogusław Michalik****4** **\", \"H. Burçin Okyar****5** **\", \"Christos Maramathas****6** **\", \"Nikos Salpadimos****1** **\"]\n- **문서링크**: [원문 전사본 전문 보기](assets/papers/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.md) | [원본 PDF 열기](assets/papers/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ/2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.pdf)\n\n---\n\n## 심층 구조화 분석 (Tier 2 Deep Structural Summary)\n\n### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 인산 비료 제조 등 다양한 산업 공정에서 발생하는 천연방사성물질(NORM) 잔재물(예: 인산석고)은 화학적 침출 및 분리 과정에서 고유의 방사평형이 교란됩니다.\n- **핵심 문제 (Problem & Gap)**: 다수의 방사분석 기관이 NORM 평가 시 U-238 및 Th-232 붕괴 계열이 영속평형(Secular Equilibrium) 상태에 있다고 잘못 가정하여 심각한 분석 오차가 발생하고 있습니다.\n- **연구 목표**: 유럽 21개국 31개 공인 방사화학 실험실의 NORM 핵종 분석 역량을 감마선 분광법, 알파 분광법, 액체섬광계수법(LSC) 전반에 걸쳐 교차 평가하고, 계통 오차의 핵심 원인을 규명합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **유럽 최대 규모의 NORM 상호비교 시험**: IAEA 기술협력 프로젝트(RER/9/155) 지원 하에 유럽 지역에서 NORM 매트릭스를 대상으로 실시된 가장 포괄적인 공인 숙련도 시험(ICE)입니다.\n- **실제 산업 공정 복합 시료 활용**: 인공 조작된 표준물이 아닌, 실제 공정에서 채취한 인산염 광석(PO)과 인산석고(PG) 시료를 직접 배포하여 실제 복합 매트릭스 효과를 검증했습니다.\n- **공인 인증과 분석 정확도의 괴리 규명**: 실험실의 공식 ISO/IEC 17025 시험기관 인정(Accreditation) 여부가 NORM 분석의 실제 정확도(Trueness)를 보장하지 못한다는 사실을 실증 데이터로 증명했습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **분석 대상 핵종** | $^{40}\\text{K}$, $^{238}\\text{U}$, $^{226}\\text{Ra}$, $^{210}\\text{Pb}$, $^{232}\\text{Th}$, $^{228}\\text{Ra}$, $^{228}\\text{Th}$ |\n| **배포 시료 매트릭스** | 인산염 광석 (Phosphate Ore: 수분 $1.3\\%$), 인산석고 (Phosphogypsum: 수분 $28.7\\%$) |\n| **참여 기관 규모** | 유럽 21개 회원국 31개 전문 방사분석 실험실 |\n| **적용 분석 기술** | 고분해능 감마선 분광법(HRGS), 알파선 분광법, 방사화학 분리 후 액체섬광계수법(LSC) |\n| **균질도 검증 기준** | 광에너지 게르마늄 검출기(BEGe, $\\sim 50\\%$ 상대효율), $186$, $609$, $1764\\text{ keV}$ 피크 합산 계수 평가 |\n| **통계 평가 지표** | ISO 13528 기준 숙련도 평가: $z$-scores (정확도/진도), $\\zeta$-scores (적합성/호환성) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **방사평형 붕괴로 인한 오차**: 인산석고의 경우 황산 반응 시 라듐은 석고 침전물로 이동하는 반면 우라늄은 인산 용액으로 분리되어 극심한 U/Ra 불평형이 발생합니다. 초기 우라늄 자손 핵종으로 Ra-226을 추정하거나 라돈 평형 대기시간을 준수하지 않은 실험실에서 대규모 오차가 집중되었습니다.\n- **인증 여부와의 무관성**: 통계 분석 결과 ISO 공인 인증을 보유한 실험실과 비인증 전문 실험실 간의 합격률($z$-score 합격 범위) 차이가 유의미하지 않았습니다.\n- **핵심 계통 오차 요인**:\n  1. 라돈 영속평형 형성 대기시간($\\ge 28\\text{일}$) 미준수\n  2. $^{208}\\text{Tl}$, $^{214}\\text{Bi}$ 등 캐스케이드 감마 방출체에 대한 동시합산 보정(TCS) 누락\n  3. 밀도가 높은 인산염 광석 매트릭스의 자가흡수(Self-attenuation) 보정 미흡\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **자율 보고 범위에 따른 표본 편차**: 보고 핵종과 분석 기법을 각 실험실 자율에 맡겨, 감마선 분광법에 비해 알파 분광법 및 LSC 데이터 표본 수가 상대적으로 적었습니다.\n- **수분 정규화 오차**: 인산석고의 높은 수분 함량($28.7\\%$)으로 인해 $80^\\circ\\text{C}$ 건조 과정에서 기관별 건조 질량 측정 편차가 2차 불확도로 작용했습니다.\n", "has_pdf": true, "pdf_name": "2025_Results_of_the_joint_IAEA_EEAE_Intercomparison_exercise_on_radioanalytical_characterization_of_NORM_samples_in_the_Europ.pdf", "pdf_size": "2.0 MB", "converted_at": "2026-10-02T14:59:43.106261"}, {"id": "2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors", "year": "2024", "en_title": "A new methodology for efficiency calibration of uncharacterized Ge detectors by using characterized Ge detectors", "ko_title": "특성 미규명 HPGe 검출기의 효율 교정을 위한 신 방법론", "journal": "*Radiation Physics and Chemistry 221 (2024) 111763*", "authors": "A. Barba-Lobo", "takeaway": "제조사 전산모사 모델이 없는 미규명 고순도 게르마늄(HPGe) 검출기를 표준선원 없이 정밀 교정하는 기법을 개발함. 이미 특성화된 검출기의 시뮬레이션 효율과 미규명 검출기의 실험 효율 간의 비율(FEPER)이 시료 두께, 밀도, 화학 조성에 무관하게 일정하게 유지된다는 사실을 수학적/실험적으로 증명하여, 단일 기준 시료만으로 임의의 형상과 밀도에 대한 계측 효율을 산출할 수 있게 함.", "tags": ["감마분광", "숙련도시험", "효율교정", "방사평형"], "summary_md": "# A new methodology for efficiency calibration of uncharacterized Ge detectors by using characterized Ge detectors\n\n- **발행연도**: 2024\n- **주요저자**: [\"A. Barba-Lobo\"]\n- **문서링크**: [원문 전사본 전문 보기](assets/papers/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.md) | [원본 PDF 열기](assets/papers/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors/2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.pdf)\n\n---\n\n## 심층 구조화 분석 (Tier 2 Deep Structural Summary)\n\n### 1. 연구 배경 및 목적 (Research Problem & Objective)\n- **연구 배경**: 감마선 분광 분석에서 다양한 시료 매트릭스, 채움 높이, 용기 형상에 따른 전에너지 피크 효율(FEPE, $\\epsilon$)의 정밀한 결정은 환경 방사능 측정의 핵심 필수 요소입니다.\n- **핵심 문제 (Problem & Gap)**: 몬테카를로 전산모사(LabSOCS, MCNP, Geant4 등)는 표준선원 제작을 생략할 수 있으나, 고가의 제조사 특성화(Characterization) 모델이 반드시 필요합니다. 특성 모델이 없는 미규명 검출기는 수많은 형상마다 표준물질을 실험적으로 측정해야 해 막대한 시간과 비용이 소모됩니다.\n- **연구 목표**: 특성화된 검출기와 미규명 검출기 사이의 수학적 효율 전달 비율을 확립하여, 단 하나의 기준 시료만으로 임의의 형상과 매트릭스에 대해 미규명 HPGe 검출기의 실제 계측 효율($\\epsilon^{\\text{exp}}$)을 정확히 산출하는 방법론을 개발 및 검증합니다.\n\n### 2. 독창성 및 핵심 기여 (Novelty & Contribution)\n- **FEPER 불변성 원리 최초 규명**: 특성화 검출기의 시뮬레이션 효율과 미규명 검출기의 실험 효율 간의 비율($\\text{FEPER} = \\epsilon^{\\text{sim}} / \\epsilon^{\\text{exp}}$)이 시료 두께($h$), 겉보기 밀도($\\rho$), 화학 조성에 무관하게 일정하다는 사실을 최초로 증명했습니다.\n- **단일 기준선원 기반 범용 교정**: 에너지($E_\\gamma$)별 FEPER 곡선을 천연 인산염 암석(PR) 시료 하나로 단 한 번 도출해 두면, 향후 임의의 시료 매트릭스에 대해 실험적 자가흡수 보정 없이 즉시 효율을 결정할 수 있습니다.\n\n### 3. 실험 조건 및 계측 파라미터 요약\n| 파라미터 (Parameter) | 상세 조건 및 분석 방법 (Specification / Method) |\n| :--- | :--- |\n| **비교 대상 검출기** | Mirion XtRa 동축형 HPGe 3기: DET-1 ($42.1\\%$ 상대효율, 특성화), DET-2 ($115.7\\%$ 상대효율, 특성화), DET-3 ($38.4\\%$ 상대효율, 미규명) |\n| **전산모사 도구** | LabSOCS 및 Geometry Composer (v4.4.1), Beaker Editor를 통한 용기 수치 모델링 |\n| **기준 교정 시료** | 천연 인산염 암석 (PR): 불화인회석 매트릭스, 밀도 $\\rho \\approx 1.6\\text{ g}\\cdot\\text{cm}^{-3}$, U-238 계열 영속평형 ($1569\\text{ Bq}\\cdot\\text{kg}^{-1}$) |\n| **테스트 지오메트리** | 원통형 4종 (C29, C36, C50, C72: 직경 $29.0 \\sim 71.8\\text{ mm}$), 마리넬리 비커 2종 (M121, M128: 직경 $120 \\sim 128\\text{ mm}$) |\n| **분석 에너지 대역** | $46\\text{ keV}$ ($^{210}\\text{Pb}$) 부터 $1765\\text{ keV}$ ($^{214}\\text{Bi}$) 까지 총 8개 대표 감마선 에너지 |\n| **검증용 복합 매트릭스** | IAEA RGU-1 규사 ($\\text{SiO}_2$, 밀도 $1.6$), 금속 주석 시료 ($\\text{Sn}$, 밀도 $3.5\\text{ g}\\cdot\\text{cm}^{-3}$), 인산석고 (PG, 밀도 $1.3$) |\n\n### 4. 핵심 정량 연구 결과 (Key Findings)\n- **지오메트리 불변성 검증**: 원통형 형상(C29~C72) 전반에서 DET-1/DET-3의 $\\text{FEPER}$ 비율은 $0.9$($46\\text{--}63\\text{ keV}$)에서 $1.2$($609\\text{--}1120\\text{ keV}$) 사이로 시료 높이에 무관하게 극도로 안정적이었습니다.\n- **밀도 및 조성 독립성**: 인산석고($1.3\\text{ g}\\cdot\\text{cm}^{-3}$)부터 고밀도 금속 주석($3.5\\text{ g}\\cdot\\text{cm}^{-3}$)까지 극한의 밀도 범위에서도 FEPER 값이 일치하여 자가흡수 보정 인자가 완벽히 상쇄됨($f_a^{\\text{sim}} = f_a^{\\text{exp}}$)을 확인했습니다.\n- **동시합산(TCS) 보정 명확화**: $609$, $1120$, $1765\\text{ keV}$에서 관측된 일부 편차는 검출기 결정 크기에 따른 순수 동시합산 효과 차이로 정확히 분리 모델링되었습니다.\n\n### 5. 한계점 및 해석상 주의사항 (Limitations & Caveats)\n- **검출기 구조 정렬 전제**: 본 연구는 동일한 연장범위 동축형(XtRa) 게르마늄 결정 기술 간에 검증되었으며, 웰형(Well-type)이나 평면형(Planar) 등 결정 기하구조가 완전히 상이한 검출기 간 교차 적용 시에는 별도 형상 보정이 요구됩니다.\n- **저에너지 마리넬리 비커 편차**: 마리넬리 형상의 경우 재진입 웰 구조의 급격한 자가흡수로 인해 $150\\text{ keV}$ 이하 극저에너지에서 미세한 오차가 발생할 수 있습니다.\n", "has_pdf": true, "pdf_name": "2024_A_new_methodology_for_efficiency_calibration_of_uncharacterized_Ge_detectors_by_using_characterized_Ge_detectors.pdf", "pdf_size": "4.6 MB", "converted_at": "2026-10-02T14:59:38.257748"}, {"id": "2022_In_Search_for_an_Ionic_Liquid_with_the_Best_Performance_during_210Pb_210Bi_Cherenkov_Counting_in_Waters_on_an_LS_Counter", "year": "2022", "en_title": "In Search for an Ionic Liquid with the Best Performance during 210Pb/210Bi Cherenkov Counting in Waters on an LS Counter", "ko_title": "체렌코프 계측을 이용한 수중 210Pb/210Bi 측정과 이온성 액체 파장 시프터", "journal": "*International Journal of Environmental Research and Public Health 19 (2022) 16563*", "authors": "Ivana Stojković, Milan Vraneš, Teona Teodora Borović, N         card.onclick = () => selectPaper(p.id);

        const tagsHtml = p.tags.map(t => `<span class="card-tag">#${t}</span>`).join("");
        const displayKoTitle = p.ko_title || p.en_title;

        card.innerHTML = `
          <div class="card-meta-row">
            <span class="card-year-badge">${p.year}</span>
            <span class="card-journal">${p.journal || ""}</span>
          </div>
          <div class="card-title-ko">${displayKoTitle}</div>
          <div class="card-title-en">${p.en_title}</div>
          <div class="card-tags">${tagsHtml}</div>
        `;
        cardListContainer.appendChild(card);
      });

      renderDetailPane();
    }

    function selectPaper(paperId) {
      currentPaperId = paperId;
      document.querySelectorAll(".paper-card").forEach(c => c.classList.remove("active"));
      renderCardList();
    }

    function renderDetailPane() {
      const paper = PAPERS.find(p => p.id === currentPaperId);
      if (!paper) return;

      dhYear.textContent = paper.year;
      dhJournal.textContent = paper.journal || "Journal / Conference";
      dhTitleKo.textContent = paper.ko_title || paper.en_title;
      dhTitleEn.textContent = paper.en_title;
      dhAuthorsText.textContent = paper.authors || "저자 정보 미기재";

      // 심층 요약 마크다운 렌더링 (원문 MD / PDF 링크 포함)
      paneSummary.innerHTML = safeMarkdown(paper.summary_md || "*요약문이 없습니다.*");
      renderMathInElementSafely(paneSummary);
    }

    // Chips Filter Events
    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", (e) => {
        const type = chip.dataset.filterType;
        const val = chip.dataset.value;

        if (type === "year") {
          document.querySelectorAll("#yearFilterChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          selectedYear = val;
        } else if (type === "tag") {
          document.querySelectorAll("#tagFilterChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          selectedTag = val;
        }

        renderCardList();
      });
    });

    // Search Input Event
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderCardList();
    });

    // Shortcut Ctrl+K
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Citation Copy
    copyCitationBtn.addEventListener("click", () => {
      const paper = PAPERS.find(p => p.id === currentPaperId);
      if (!paper) return;
      const citation = `${paper.authors} (${paper.year}). "${paper.en_title}". ${paper.journal || ""}`;
      navigator.clipboard.writeText(citation).then(() => {
        const prevText = copyCitationBtn.textContent;
        copyCitationBtn.textContent = "✅ 인용 복사됨!";
        setTimeout(() => copyCitationBtn.textContent = prevText, 2000);
      });
    });

    // Immediate & Safe Initialization
    function initApp() {
      renderCardList();
      setTimeout(() => {
        renderMathInElementSafely(paneSummary);
      }, 300);
    }

    if (document.readyState === "loading") {
      window.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
